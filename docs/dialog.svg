  <rect width="720" height="1786" fill="#d6e0ea"/>
  <rect x="0" y="0" width="720" height="42" fill="#ffffff"/>
  <circle cx="26" cy="21" r="13" fill="#2b7fd4"/>
  <text x="21" y="26" font-size="14" fill="#ffffff">🌴</text>
  <text x="48" y="18" font-size="13.5" font-weight="600" fill="#16181d">АПРЕЛЬ тур</text>
  <text x="48" y="33" font-size="11" fill="#7b8794">живой прогон · цены из Tutu.ru по MCP</text>
  <rect x="18" y="58" width="395" height="92" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="78" font-size="13.2" fill="#16181d">🛫 Откуда вылетаете?</text>
  <text x="31" y="97" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="116" font-size="13.2" fill="#16181d">Нужно, чтобы посчитать перелёт — цена сильно зависит</text>
  <text x="31" y="135" font-size="13.2" fill="#16181d">от города.</text>
  <rect x="582" y="159" width="120" height="35" rx="11" fill="#e7f6d5" stroke="#cfe7b4"/>
  <text x="595" y="179" font-size="13.2" fill="#16181d">🏙 Москва</text>
  <rect x="18" y="203" width="359" height="92" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="223" font-size="13.2" fill="#16181d">📅 Когда планируете поездку?</text>
  <text x="31" y="242" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="261" font-size="13.2" fill="#16181d">Выберите вариант кнопкой или напишите свои даты</text>
  <text x="31" y="280" font-size="13.2" fill="#16181d">(например: 15-22 июня).</text>
  <rect x="542" y="304" width="160" height="35" rx="11" fill="#e7f6d5" stroke="#cfe7b4"/>
  <text x="555" y="324" font-size="13.2" fill="#16181d">15-22 сентября 2026</text>
  <rect x="18" y="348" width="189" height="35" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="368" font-size="13.2" fill="#16181d">📅 Понял: 15–22 сентября</text>
  <rect x="18" y="392" width="366" height="111" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="412" font-size="13.2" fill="#16181d">👥 Сколько взрослых поедет?</text>
  <text x="31" y="431" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="450" font-size="13.2" fill="#16181d">Взрослый тариф — с 12 лет. Возрасты детей спрошу</text>
  <text x="31" y="469" font-size="13.2" fill="#16181d">следующим вопросом.</text>
  <text x="31" y="488" font-size="13.2" fill="#16181d">Кнопка или число от 1 до 50.</text>
  <rect x="582" y="512" width="120" height="35" rx="11" fill="#e7f6d5" stroke="#cfe7b4"/>
  <text x="595" y="532" font-size="13.2" fill="#16181d">2</text>
  <rect x="18" y="556" width="388" height="130" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="576" font-size="13.2" fill="#16181d">🎂 Сколько лет детям?</text>
  <text x="31" y="595" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="614" font-size="13.2" fill="#16181d">Напишите возрасты числами через запятую — например:</text>
  <text x="31" y="633" font-size="13.2" fill="#16181d">5, 9</text>
  <text x="31" y="652" font-size="13.2" fill="#16181d">Малышам до года так и напишите: «до года».</text>
  <text x="31" y="671" font-size="13.2" fill="#16181d">Если детей нет — отправьте 0.</text>
  <rect x="582" y="695" width="120" height="35" rx="11" fill="#e7f6d5" stroke="#cfe7b4"/>
  <text x="595" y="715" font-size="13.2" fill="#16181d">до года, 7</text>
  <rect x="18" y="739" width="317" height="35" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="759" font-size="13.2" fill="#16181d">👥 Записал: 2 взр. + дети: до года и 7 лет</text>
  <text x="360" y="799" font-size="11.5" fill="#6b7783" text-anchor="middle">⋯ бюджет, способ связи и телефон — ещё три шага ⋯</text>
  <rect x="18" y="813" width="381" height="225" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
