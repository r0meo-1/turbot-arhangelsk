  <text x="31" y="890" font-size="13.2" fill="#16181d">📍 Направление: Египет</text>
  <text x="31" y="909" font-size="13.2" fill="#16181d">🛫 Откуда: Москва</text>
  <text x="31" y="928" font-size="13.2" fill="#16181d">📅 Даты: 15-22 сентября 2026</text>
  <text x="31" y="947" font-size="13.2" fill="#16181d">👥 Состав: 2 взр. + дети: до года и 7 лет</text>
  <text x="31" y="966" font-size="13.2" fill="#16181d">💰 Бюджет: 100000₽</text>
  <text x="31" y="985" font-size="13.2" fill="#16181d">📞 Связь: +79211234567</text>
  <text x="31" y="1004" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="1023" font-size="13.2" fill="#16181d">Спасибо, что выбрали нас 🌺</text>
