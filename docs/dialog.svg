  <text x="31" y="1276" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="1295" font-size="13.2" fill="#16181d">Нажмите «✍️ Ответить» ниже — или /send 424242</text>
  <rect x="18" y="1319" width="395" height="320" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
