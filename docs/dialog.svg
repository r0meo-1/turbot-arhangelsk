  <text x="31" y="1086" font-size="13.2" fill="#16181d">Личное уведомление администратору</text>
  <text x="31" y="1105" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="1124" font-size="13.2" fill="#16181d">От: Роман (@roman)</text>
  <text x="31" y="1143" font-size="13.2" fill="#16181d">ID: 424242</text>
  <text x="31" y="1162" font-size="13.2" fill="#16181d">📍 Египет</text>
  <text x="31" y="1181" font-size="13.2" fill="#16181d">🛫 Откуда: Москва</text>
  <text x="31" y="1200" font-size="13.2" fill="#16181d">📅 15-22 сентября 2026</text>
  <text x="31" y="1219" font-size="13.2" fill="#16181d">👥 2 взр. + дети: до года и 7 лет</text>
