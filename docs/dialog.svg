  <text x="31" y="1396" font-size="13.2" fill="#16181d">• 138 490 ₽ · Pegasus Airlines · 15 сен, 15:05 · 13</text>
  <text x="31" y="1415" font-size="13.2" fill="#16181d">ч 45 мин</text>
  <text x="31" y="1434" font-size="13.2" fill="#16181d">• 144 301 ₽ · Pegasus Airlines, AJet · 15 сен, 15:05</text>
  <text x="31" y="1453" font-size="13.2" fill="#16181d">· 13 ч 55 мин</text>
  <text x="31" y="1472" font-size="13.2" fill="#16181d">• 145 993 ₽ · Pegasus Airlines · 15 сен, 06:10 · 13</text>
  <text x="31" y="1491" font-size="13.2" fill="#16181d">ч 45 мин</text>
  <text x="31" y="1510" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="1529" font-size="13.2" fill="#16181d">Это цены на билеты по данным Tutu.ru — ориентир,</text>
  <text x="31" y="1548" font-size="13.2" fill="#16181d">чтобы вы понимали порядок сумм.</text>
  <text x="31" y="1567" font-size="13.2" fill="#16181d">Менеджер посчитает пакет с отелем и трансфером —</text>
  <text x="31" y="1586" font-size="13.2" fill="#16181d">обычно выходит выгоднее, чем собирать по частям.</text>
  <text x="31" y="1605" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="1624" font-size="13.2" fill="#16181d">🔗 Посмотреть все варианты</text>
  <rect x="18" y="1648" width="373" height="111" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="1668" font-size="13.2" fill="#16181d">💼 По заявке от Роман</text>
  <text x="31" y="1687" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="1706" font-size="13.2" fill="#16181d">📊 Рынок сейчас: от 138 490 ₽ · Москва → Хургада ·</text>
