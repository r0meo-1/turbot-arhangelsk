  <text x="48" y="18" font-size="13.5" font-weight="600" fill="#16181d">АПРЕЛЬ тур</text>
  <text x="48" y="33" font-size="11" fill="#7b8794">живой прогон · цены из Tutu.ru по MCP</text>
  <rect x="18" y="58" width="395" height="92" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="78" font-size="13.2" fill="#16181d">🛫 Откуда вылетаете?</text>
  <text x="31" y="97" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="116" font-size="13.2" fill="#16181d">Нужно, чтобы посчитать перелёт — цена сильно зависит</text>
  <text x="31" y="135" font-size="13.2" fill="#16181d">от города.</text>
