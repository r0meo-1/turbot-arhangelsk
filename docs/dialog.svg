  <rect x="18" y="556" width="381" height="73" rx="11" fill="#ffffff" stroke="#e0e5ea"/>
  <text x="31" y="576" font-size="13.2" fill="#16181d">🧒 Дети до 12 лет едут?</text>
  <text x="31" y="595" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="614" font-size="13.2" fill="#16181d">У них свой тариф — без этого расчёт будет завышен.</text>
