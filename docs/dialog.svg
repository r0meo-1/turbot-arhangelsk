  <text x="31" y="1522" font-size="13.2" fill="#16181d">• 145 281 ₽ · Pegasus Airlines, AJet · 15 сен, 15:05</text>
  <text x="31" y="1541" font-size="13.2" fill="#16181d">· 13 ч 55 мин</text>
