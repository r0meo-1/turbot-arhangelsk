  <text x="31" y="721" font-size="13.2" fill="#16181d"></text>
  <text x="31" y="740" font-size="13.2" fill="#16181d">Напишите через запятую — например: 5, 9</text>
  <text x="31" y="759" font-size="13.2" fill="#16181d">Малышам до года так и напишите: «до года».</text>
