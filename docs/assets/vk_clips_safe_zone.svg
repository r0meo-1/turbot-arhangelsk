<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <title>TurBot VK Clips Safe Zone 1080x1920</title>
  <desc>Official VK top 10% and bottom 20% exclusion zones plus conservative TurBot side guards.</desc>

  <rect x="0" y="0" width="1080" height="1920" fill="none"/>

  <!-- Official VK hard exclusion zones -->
  <rect x="0" y="0" width="1080" height="192" fill="#ff4d4d" fill-opacity="0.22"/>
  <rect x="0" y="1536" width="1080" height="384" fill="#ff4d4d" fill-opacity="0.22"/>

  <!-- TurBot conservative side guards, not official VK constants -->
  <rect x="0" y="192" width="108" height="1344" fill="#f5b642" fill-opacity="0.18"/>
  <rect x="864" y="192" width="216" height="1344" fill="#f5b642" fill-opacity="0.18"/>

  <!-- Critical-content safe box -->
  <rect x="108" y="192" width="756" height="1344"
        fill="#35c77a" fill-opacity="0.05"
        stroke="#35c77a" stroke-width="4" stroke-dasharray="18 12"/>

  <!-- Suggested hook area -->
  <rect x="156" y="300" width="660" height="500"
        fill="none" stroke="#3aa7ff" stroke-width="3" stroke-dasharray="12 10"/>

  <!-- Suggested CTA area -->
  <rect x="156" y="1080" width="660" height="370"
        fill="none" stroke="#9b6bff" stroke-width="3" stroke-dasharray="12 10"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">
    <text x="36" y="62" fill="#b51616">VK OFFICIAL: TOP 10% / 192 px</text>
    <text x="36" y="1600" fill="#b51616">VK OFFICIAL: BOTTOM 20% / 384 px</text>
    <text x="130" y="246" fill="#167844">CRITICAL SAFE BOX 756 x 1344</text>
    <text x="178" y="350" fill="#1579b8">SUGGESTED HOOK / HEADLINE AREA</text>
    <text x="178" y="1130" fill="#6741b8">SUGGESTED CTA / END-CARD AREA</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24">
    <text x="18" y="270" transform="rotate(-90 18 270)" fill="#9b6600">10% LEFT PROJECT GUARD</text>
    <text x="1040" y="520" transform="rotate(90 1040 520)" fill="#9b6600">20% RIGHT PROJECT GUARD</text>
    <text x="130" y="1510" fill="#444">Import as a non-exporting overlay. Side guards are conservative TurBot rules, not VK official constants.</text>
  </g>

  <!-- Center guides -->
  <line x1="540" y1="192" x2="540" y2="1536" stroke="#777" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="108" y1="960" x2="864" y2="960" stroke="#777" stroke-opacity="0.35" stroke-width="2"/>
</svg>
