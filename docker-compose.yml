# TurBot — Docker Compose for Telegram + VK bots behind an HTTP nginx proxy.
#
# Usage:
#   1. Copy .env.example to .env and fill in tokens
#   2. docker compose up -d
#
# For production, terminate HTTPS in a reverse proxy (nginx, Caddy, Traefik)
# in front of port 80. The VM installer remains the turnkey TLS option.

services:
  telegram-bot:
    build: .
    container_name: turbot-telegram
    restart: always
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot_state.sqlite
      PORT: "5000"
    ports:
      - "127.0.0.1:8000:5000"
    volumes:
      - bot-data:/app/data
    command: >
      gunicorn bot:app
      --bind 0.0.0.0:5000
      --workers 1 --threads 4 --timeout 60

  vk-bot:
    build: .
    container_name: turbot-vk
    restart: always
    env_file: .env
    environment:
      VK_DATABASE_PATH: /app/data/vk_bot_state.sqlite
      VK_PORT: "5100"
    ports:
      - "127.0.0.1:5100:5100"
    volumes:
      - bot-data:/app/data
    command: >
      gunicorn vk_bot:app
      --bind 0.0.0.0:5100
      --workers 1 --threads 4 --timeout 60

  nginx:
    image: nginx:alpine
    container_name: turbot-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/turbot.conf:ro
    depends_on:
      - telegram-bot
      - vk-bot

volumes:
  bot-data:
