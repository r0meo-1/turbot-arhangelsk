# ⚠️  WARNING: Render.com is a US-based hosting provider.
# Deploying here stores personal data (names, phone numbers) OUTSIDE Russia,
# which violates Federal Law 152-ФЗ (ст. 18 ч. 5) on data localisation.
#
# This file is kept for quick demos / testing ONLY.
# For production with personal data, deploy to a Russian VM instead.
# See DEPLOY.md for step-by-step instructions.
#
# Free tier sleeps ~15 min idle. Demo keep-alive:
#   GitHub secret RENDER_HEALTH_URL = https://THIS-SERVICE.onrender.com/health
#   Workflow: .github/workflows/keep-alive.yml
services:
  - type: web
    name: turbot-arhangelsk
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Bind ALL interfaces on Render-assigned $PORT (required for health check).
    startCommand: gunicorn bot:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: AI_MODE
        value: template
      - key: MDT_ENABLED
        value: "false"
      - key: DIALOG_TIMEOUT_HOURS
        value: "6"
