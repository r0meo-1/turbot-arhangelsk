name: Apply stacked Telegram contact buttons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stacked-contact-buttons.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stack contact buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("bot.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line.startswith("def kb_contact_methods()"))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith("def "))
          back = next(i for i in range(start, end) if "BACK_BUTTON_TEXT, CB_BACK" in lines[i])
          if "CANCEL_BUTTON_TEXT, CB_CANCEL" not in lines[back + 1]:
              raise SystemExit("Unexpected contact keyboard layout")
          indent = lines[back][:len(lines[back]) - len(lines[back].lstrip())]
          lines[back - 1:back + 3] = [
              indent + "[_inline_btn(BACK_BUTTON_TEXT, CB_BACK)],\n",
              indent + "[_inline_btn(CANCEL_BUTTON_TEXT, CB_CANCEL)],\n",
          ]
          path.write_text("".join(lines), encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Stack Telegram contact buttons"
          git push origin HEAD:main
