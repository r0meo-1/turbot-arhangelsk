name: Apply stacked Telegram contact buttons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-stacked-contact-buttons.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stack contact buttons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def kb_contact_methods() -> str:")
          end = text.index("\n\ndef kb_destinations() -> str:", start)
          block = text[start:end]
          old = """        [
              _inline_btn(BACK_BUTTON_TEXT, CB_BACK),
              _inline_btn(CANCEL_BUTTON_TEXT, CB_CANCEL),
          ],"""
          new = """        [_inline_btn(BACK_BUTTON_TEXT, CB_BACK)],
          [_inline_btn(CANCEL_BUTTON_TEXT, CB_CANCEL)],"""
          if old not in block:
              raise SystemExit("Target contact navigation row not found")
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Stack Telegram contact buttons"
          git push origin HEAD:main
