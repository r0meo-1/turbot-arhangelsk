name: Patch Telegram MDT retry health v2

on:
  push:
    branches:
      - "work/tg-mdt-retry-health"
    paths:
      - ".github/tg-mdt-retry-health-v2.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/tg-mdt-retry-health
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_patch_tg_mdt_health.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Commit clean patch
        shell: bash
        run: |
          rm -f .github/workflows/tmp-tg-mdt-retry-health.yml
          rm -f .github/workflows/tmp-tg-mdt-retry-health-v2.yml
          rm -f .github/tg-mdt-retry-health.trigger
          rm -f .github/tg-mdt-retry-health-v2.trigger
          rm -f scripts/_patch_tg_mdt_health.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose MDT retry queue health metrics"
          git push origin HEAD:work/tg-mdt-retry-health
