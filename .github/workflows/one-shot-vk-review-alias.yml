name: One-shot VK Mini App review return patch

on:
  push:
    branches:
      - fix/vk-miniapp-review-return
    paths:
      - .github/vk-review-alias-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-miniapp-review-return
      - name: Patch review return alias and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path('vk_bot.py')
          text = bot.read_text(encoding='utf-8')
          old = '    "кнопки": "menu", "меню": "menu", "продолжить": "menu", "где кнопки": "menu",\n'
          new = (
              '    "кнопки": "menu", "меню": "menu", "продолжить": "menu", "где кнопки": "menu",\n'
              '    "проверить заявку": "menu", "проверить": "menu",\n'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected command alias block')
          bot.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_vk_bot.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_miniapp_review_return_aliases_replay_current_state():'
          if marker not in test_text:
              test_text += '''\n\n
def test_miniapp_review_return_aliases_replay_current_state(monkeypatch):
    assert bot._COMMAND_ALIASES["проверить заявку"] == "menu"
    assert bot._COMMAND_ALIASES["проверить"] == "menu"

    bot.user_data[424242] = {"state": bot.STATE_REVIEW}
    prompted = []
    monkeypatch.setattr(bot, "_prompt_for_state", lambda user_id, state: prompted.append((user_id, state)))
    monkeypatch.setattr(bot, "get_user_name", lambda user_id: "Тест")

    event = {
        "object": {
            "message": {
                "from_id": 424242,
                "peer_id": 424242,
                "text": "Проверить заявку",
                "payload": None,
            }
        }
    }
    bot._process_message(event)
    assert prompted == [(424242, bot.STATE_REVIEW)]
'''
              tests.write_text(test_text, encoding='utf-8')
          PY
          python -m compileall -q vk_bot.py tests/test_vk_bot.py
          git diff --check
          pytest -q tests/test_vk_bot.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py tests/test_vk_bot.py
          git commit -m "Make VK Mini App review return explicit"
          git push origin HEAD:fix/vk-miniapp-review-return
