name: One-shot VK Mini App review return patch

on: push

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-miniapp-review-return
      - name: Patch review return alias
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vk_bot.py')
          text = path.read_text(encoding='utf-8')
          old = '    "кнопки": "menu", "меню": "menu", "продолжить": "menu", "где кнопки": "menu",\n'
          new = old + '    "проверить заявку": "menu", "проверить": "menu",\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected command alias block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q vk_bot.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py
          git commit -m "Make VK Mini App review return explicit"
          git push origin HEAD:fix/vk-miniapp-review-return
