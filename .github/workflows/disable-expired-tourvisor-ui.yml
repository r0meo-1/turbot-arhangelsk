name: Disable expired Tourvisor UI

on:
  push:
    paths:
      - '.github/workflows/disable-expired-tourvisor-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python scripts/patch_expired_tourvisor_ui.py
      - run: |
          python -m pip install -r requirements.txt pytest
          pytest -q
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/disable-expired-tourvisor-ui.yml scripts/patch_expired_tourvisor_ui.py
          git add vk_bot.py tests/test_vk_live_tour_safety.py
          git commit -m 'Hide live tour search when Tourvisor JWT expires'
          git push origin HEAD:main
