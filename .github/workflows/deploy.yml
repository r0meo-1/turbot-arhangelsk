name: Deploy TurBot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turbot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0, Node 24
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trigger restricted server deploy
        env:
          VK_MINI_APP_ID: ${{ secrets.VK_MINI_APP_ID }}
          VK_MINI_APP_SECRET: ${{ secrets.VK_MINI_APP_SECRET }}
          MDT_API_KEY: ${{ secrets.MDT_API_KEY }}
          TRAVELATA_USERNAME: ${{ secrets.TRAVELATA_USERNAME }}
          TRAVELATA_PASSWORD: ${{ secrets.TRAVELATA_PASSWORD }}
        run: |
          set -Eeuo pipefail

          test -n "$VK_MINI_APP_ID"
          test -n "$VK_MINI_APP_SECRET"
          test -n "$MDT_API_KEY"

          # Travelata access is optional until the partner API is approved,
          # but partial credentials are never accepted.
          if [[ -n "$TRAVELATA_USERNAME" || -n "$TRAVELATA_PASSWORD" ]]; then
            if [[ -z "$TRAVELATA_USERNAME" || -z "$TRAVELATA_PASSWORD" ]]; then
              echo "Travelata GitHub secrets must be configured as a complete pair" >&2
              exit 1
            fi
          fi

          app_id_b64="$(printf '%s' "$VK_MINI_APP_ID" | base64 -w0)"
          secret_b64="$(printf '%s' "$VK_MINI_APP_SECRET" | base64 -w0)"
          mdt_key_b64="$(printf '%s' "$MDT_API_KEY" | base64 -w0)"
          travelata_user_b64="$(printf '%s' "$TRAVELATA_USERNAME" | base64 -w0)"
          travelata_password_b64="$(printf '%s' "$TRAVELATA_PASSWORD" | base64 -w0)"

          # First connection uses the legacy payload understood by older
          # root-owned deploy entrypoints. It updates the server checkout and
          # installs the current deploy script before we require payload V3.
          printf 'TURBOT_DEPLOY_CONFIG_V1\n%s\n%s\n' \
            "$app_id_b64" \
            "$secret_b64" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

          # Second connection runs the freshly installed entrypoint. V3 keeps
          # MDT protected configuration and optionally installs Travelata API
          # credentials without ever printing them. Empty Travelata values mean
          # "preserve existing server values", not "erase them".
          printf 'TURBOT_DEPLOY_CONFIG_V3\n%s\n%s\n%s\n%s\n%s\n' \
            "$app_id_b64" \
            "$secret_b64" \
            "$mdt_key_b64" \
            "$travelata_user_b64" \
            "$travelata_password_b64" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

      - name: Verify public Mini App production routes
        shell: bash
        env:
          VK_MINI_APP_ID: ${{ secrets.VK_MINI_APP_ID }}
          VK_MINI_APP_SECRET: ${{ secrets.VK_MINI_APP_SECRET }}
        run: |
          set -euo pipefail
          vk_base="https://bot.r0meo1.ru/vk"
          tg_submit="https://bot.r0meo1.ru/miniapp/submit"

          test -n "$VK_MINI_APP_ID"
          test -n "$VK_MINI_APP_SECRET"

          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$vk_base/health" >/dev/null && \
               html="$(curl -fsSL --max-time 15 "$vk_base/miniapp/")" && \
               js="$(curl -fsSL --max-time 15 "$vk_base/miniapp/app.js")"; then
              if grep -q 'trip-form' <<<"$html" && \
                 grep -q "budgetScope: 'total'" <<<"$js" && \
                 grep -q "source: 'vk_mini_app'" <<<"$js" && \
                 grep -q "VKWebAppSendPayload" <<<"$js" && \
                 grep -q "miniapp_review" <<<"$js"; then
                break
              fi
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "VK external production smoke failed" >&2
              exit 1
            fi
            echo "VK public routes not ready yet (attempt $attempt/12)"
            sleep 5
          done

          vk_auth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$vk_base/miniapp/draft" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          if [[ "$vk_auth_status" != "401" ]]; then
            echo "VK invalid-auth request returned HTTP $vk_auth_status, expected 401" >&2
            exit 1
          fi

          # Prove that the production app ID/secret pair can authenticate a
          # current VK launch. The payload is deliberately invalid, so the
          # request must stop at validation with HTTP 400 before save_draft().
          vk_signed_request="$(python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          from urllib.parse import urlencode

          params = {
              "vk_app_id": os.environ["VK_MINI_APP_ID"],
              "vk_group_id": "240310110",
              "vk_ts": str(int(time.time())),
              "vk_user_id": "2147483000",
          }
          signed = urlencode(sorted(params.items()))
          signature = base64.urlsafe_b64encode(
              hmac.new(
                  os.environ["VK_MINI_APP_SECRET"].encode(),
                  signed.encode(),
                  hashlib.sha256,
              ).digest()
          ).decode().rstrip("=")
          launch_params = urlencode([*sorted(params.items()), ("sign", signature)])
          print(json.dumps({"launchParams": launch_params, "payload": {}}, separators=(",", ":")))
          PY
          )"

          vk_signed_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$vk_base/miniapp/draft" \
            -H 'Content-Type: application/json' \
            --data "$vk_signed_request")"
          if [[ "$vk_signed_status" != "400" ]]; then
            echo "VK signed-auth probe returned HTTP $vk_signed_status, expected 400" >&2
            exit 1
          fi

          tg_auth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$tg_submit" \
            -H 'Origin: https://r0meo-1.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"initData":"tampered","payload":{}}')"
          if [[ "$tg_auth_status" != "401" ]]; then
            echo "Telegram invalid-auth request returned HTTP $tg_auth_status, expected 401" >&2
            exit 1
          fi

          echo "Public Mini App routes, VK app_payload assets, auth rejection, and signed VK auth smoke: ok"
