name: Deploy TurBot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turbot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0, Node 24
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trigger restricted server deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          VK_MINI_APP_ID: ${{ secrets.VK_MINI_APP_ID }}
          VK_MINI_APP_SECRET: ${{ secrets.VK_MINI_APP_SECRET }}
          MDT_API_KEY: ${{ secrets.MDT_API_KEY }}
          TRAVELATA_USERNAME: ${{ secrets.TRAVELATA_USERNAME }}
          TRAVELATA_PASSWORD: ${{ secrets.TRAVELATA_PASSWORD }}
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          SLETAT_LOGIN: ${{ secrets.SLETAT_LOGIN }}
          SLETAT_PASSWORD: ${{ secrets.SLETAT_PASSWORD }}
        run: |
          set -Eeuo pipefail
          chmod +x deploy/send-production-config.sh
          deploy/send-production-config.sh

      - name: Verify public Mini App production routes
        shell: bash
        env:
          VK_MINI_APP_ID: ${{ secrets.VK_MINI_APP_ID }}
          VK_MINI_APP_SECRET: ${{ secrets.VK_MINI_APP_SECRET }}
        run: |
          set -euo pipefail
          vk_base="https://bot.r0meo1.ru/vk"
          tg_submit="https://bot.r0meo1.ru/miniapp/submit"

          test -n "$VK_MINI_APP_ID"
          test -n "$VK_MINI_APP_SECRET"

          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$vk_base/health" >/dev/null && \
               html="$(curl -fsSL --max-time 15 "$vk_base/miniapp/")" && \
               js="$(curl -fsSL --max-time 15 "$vk_base/miniapp/app.js")"; then
              if grep -q 'trip-form' <<<"$html" && \
                 grep -q "budgetScope: 'total'" <<<"$js" && \
                 grep -q "source: 'vk_mini_app'" <<<"$js" && \
                 grep -q "VKWebAppSendPayload" <<<"$js" && \
                 grep -q "miniapp_review" <<<"$js"; then
                break
              fi
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "VK external production smoke failed" >&2
              exit 1
            fi
            echo "VK public routes not ready yet (attempt $attempt/12)"
            sleep 5
          done

          # Code/content-specific legal assertions run after Deploy Bundle.
          # This config workflow can execute while the previous app revision is
          # still serving, so it only checks route availability here.
          for legal_path in privacy.html consent.html terms.html moderation.html legal.json; do
            curl -fsSL --max-time 15 "$vk_base/miniapp/$legal_path" >/dev/null
          done

          vk_auth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$vk_base/miniapp/draft" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          if [[ "$vk_auth_status" != "401" ]]; then
            echo "VK invalid-auth request returned HTTP $vk_auth_status, expected 401" >&2
            exit 1
          fi

          # Prove that the production app ID/secret pair can authenticate a
          # current VK launch. The payload is deliberately invalid, so the
          # request must stop at validation with HTTP 400 before save_draft().
          vk_signed_request="$(python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          from urllib.parse import urlencode

          params = {
              "vk_app_id": os.environ["VK_MINI_APP_ID"],
              "vk_group_id": "240310110",
              "vk_ts": str(int(time.time())),
              "vk_user_id": "2147483000",
          }
          signed = urlencode(sorted(params.items()))
          signature = base64.urlsafe_b64encode(
              hmac.new(
                  os.environ["VK_MINI_APP_SECRET"].encode(),
                  signed.encode(),
                  hashlib.sha256,
              ).digest()
          ).decode().rstrip("=")
          launch_params = urlencode([*sorted(params.items()), ("sign", signature)])
          print(json.dumps({"launchParams": launch_params, "payload": {}}, separators=(",", ":")))
          PY
          )"

          vk_signed_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$vk_base/miniapp/draft" \
            -H 'Content-Type: application/json' \
            --data "$vk_signed_request")"
          if [[ "$vk_signed_status" != "400" ]]; then
            echo "VK signed-auth probe returned HTTP $vk_signed_status, expected 400" >&2
            exit 1
          fi

          # End-to-end Booking.com smoke. The partner program is optional while
          # Travelpayouts approval is pending; that one explicit provider state
          # is a skip. Any other non-200 response remains a deployment failure.
          vk_booking_request="$(python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time
          from datetime import date, timedelta
          from urllib.parse import urlencode

          params = {
              "vk_app_id": os.environ["VK_MINI_APP_ID"],
              "vk_group_id": "240310110",
              "vk_ts": str(int(time.time())),
              "vk_user_id": "2147483000",
          }
          signed = urlencode(sorted(params.items()))
          signature = base64.urlsafe_b64encode(
              hmac.new(
                  os.environ["VK_MINI_APP_SECRET"].encode(),
                  signed.encode(),
                  hashlib.sha256,
              ).digest()
          ).decode().rstrip("=")
          launch_params = urlencode([*sorted(params.items()), ("sign", signature)])
          payload = {
              "type": "trip_request",
              "version": 2,
              "destination": "Phuket",
              "departure": "Moscow",
              "date": (date.today() + timedelta(days=30)).isoformat(),
              "nights": 7,
              "adults": 2,
              "children": 0,
              "childrenAges": [],
              "budgetMaxRub": 250000,
              "budgetScope": "total",
              "consent": True,
              "termsAccepted": True,
              "directOnly": False,
          }
          print(json.dumps({"launchParams": launch_params, "payload": payload}, separators=(",", ":")))
          PY
          )"

          booking_response="$(mktemp)"
          booking_status="$(curl -sS -o "$booking_response" -w '%{http_code}' --max-time 25 \
            -X POST "$vk_base/miniapp/booking-link" \
            -H 'Content-Type: application/json' \
            --data "$vk_booking_request")"
          booking_optional_skip=false
          if [[ "$booking_status" != "200" ]]; then
            booking_error_code="$(python - "$booking_response" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
              print(str(data.get("errorCode") or ""))
          except Exception:
              print("")
          PY
            )"
            if [[ "$booking_error_code" == "booking_program_not_enabled" ]]; then
              echo "VK Booking.com partner-link smoke: skipped (partner program not enabled yet)"
              booking_optional_skip=true
            else
              echo "VK Booking.com partner-link smoke returned HTTP $booking_status" >&2
              python - "$booking_response" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  data = json.load(fh)
              print("Provider error:", data.get("error", "unknown"), file=sys.stderr)
              print("Provider code:", data.get("errorCode", "unknown"), file=sys.stderr)
          except Exception:
              print("Provider returned a non-JSON error", file=sys.stderr)
          PY
              rm -f "$booking_response"
              exit 1
            fi
          fi

          if [[ "$booking_optional_skip" != "true" ]]; then
            python - "$booking_response" <<'PY'
          import json
          import sys
          from urllib.parse import urlparse

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          url = str(data.get("url", "")).strip()
          parsed = urlparse(url)
          if data.get("ok") is not True or parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("VK Booking.com partner-link smoke returned an invalid URL")
          print(f"VK Booking.com partner-link smoke: ok host={parsed.netloc}")
          PY
          fi
          rm -f "$booking_response"

          tg_auth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$tg_submit" \
            -H 'Origin: https://r0meo-1.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"initData":"tampered","payload":{}}')"
          if [[ "$tg_auth_status" != "401" ]]; then
            echo "Telegram invalid-auth request returned HTTP $tg_auth_status, expected 401" >&2
            exit 1
          fi

          echo "Public Mini App routes, VK auth, Booking.com probe, and Telegram auth smoke: ok"
