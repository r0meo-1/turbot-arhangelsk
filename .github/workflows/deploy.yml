name: Deploy TurBot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turbot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0, Node 24
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trigger restricted server deploy
        env:
          VK_MINI_APP_ID: ${{ secrets.VK_MINI_APP_ID }}
          VK_MINI_APP_SECRET: ${{ secrets.VK_MINI_APP_SECRET }}
        run: |
          set -Eeuo pipefail

          test -n "$VK_MINI_APP_ID"
          test -n "$VK_MINI_APP_SECRET"

          app_id_b64="$(printf '%s' "$VK_MINI_APP_ID" | base64 -w0)"
          secret_b64="$(printf '%s' "$VK_MINI_APP_SECRET" | base64 -w0)"

          printf 'TURBOT_DEPLOY_CONFIG_V1\n%s\n%s\n' \
            "$app_id_b64" \
            "$secret_b64" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true
