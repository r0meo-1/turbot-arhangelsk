name: Deploy TurBot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turbot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0, Node 24
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trigger restricted server deploy
        env:
          VK_MINI_APP_ID: ${{ secrets.VK_MINI_APP_ID }}
          VK_MINI_APP_SECRET: ${{ secrets.VK_MINI_APP_SECRET }}
          MDT_API_KEY: ${{ secrets.MDT_API_KEY }}
        run: |
          set -Eeuo pipefail

          test -n "$VK_MINI_APP_ID"
          test -n "$VK_MINI_APP_SECRET"
          test -n "$MDT_API_KEY"

          app_id_b64="$(printf '%s' "$VK_MINI_APP_ID" | base64 -w0)"
          secret_b64="$(printf '%s' "$VK_MINI_APP_SECRET" | base64 -w0)"
          mdt_key_b64="$(printf '%s' "$MDT_API_KEY" | base64 -w0)"

          # First connection uses the legacy payload understood by older
          # root-owned deploy entrypoints. It updates the server checkout and
          # installs the current deploy script before we require payload V2.
          printf 'TURBOT_DEPLOY_CONFIG_V1\n%s\n%s\n' \
            "$app_id_b64" \
            "$secret_b64" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

          # Second connection runs the freshly installed entrypoint and
          # enables MDT with the protected API key.
          printf 'TURBOT_DEPLOY_CONFIG_V2\n%s\n%s\n%s\n' \
            "$app_id_b64" \
            "$secret_b64" \
            "$mdt_key_b64" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

      - name: Verify public VK production routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://bot.r0meo1.ru/vk"
          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$base/health" >/dev/null && \
               html="$(curl -fsSL --max-time 15 "$base/miniapp/")" && \
               js="$(curl -fsSL --max-time 15 "$base/miniapp/app.js")"; then
              if grep -q 'trip-form' <<<"$html" && \
                 grep -q "budgetScope: 'total'" <<<"$js" && \
                 grep -q "source: 'vk_mini_app'" <<<"$js"; then
                echo "VK external production smoke: ok"
                exit 0
              fi
            fi
            echo "VK public routes not ready yet (attempt $attempt/12)"
            sleep 5
          done
          echo "VK external production smoke failed" >&2
          exit 1
