name: Security Baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan tracked files for high-confidence credentials
        run: python scripts/scan_repo_secrets.py
      - name: Test secret scanner behavior
        run: python -m pytest -q tests/test_scan_repo_secrets.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit resolved Python dependency set
        run: pip-audit -r requirements-dev.txt --progress-spinner off

  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify signed-input validation and response-header contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_telegram_webapp.py
          pytest -q tests/test_vk_miniapp.py
          pytest -q tests/test_bot.py -k "security_headers"
