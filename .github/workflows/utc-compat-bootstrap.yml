name: Prepare UTC compatibility fix

on:
  push:
    branches: [fix/utcnow-warning-gate-20260924]
    paths:
      - tools/apply_utc_compat.py
      - .github/workflows/utc-compat-bootstrap.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'r0meo-1/turbot-arhangelsk' && github.ref == 'refs/heads/fix/utcnow-warning-gate-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply bounded source rewrite and remove one-shot tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = fc14acc8f1e17067e2d80de4b31cfdf0849da9b4
          python3 tools/apply_utc_compat.py
          git rm tools/apply_utc_compat.py .github/workflows/utc-compat-bootstrap.yml
          git add -- bot.py vk_bot.py website_app.py shared/travel_crm.py shared/travel_crm_store.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace deprecated UTC factories without changing CRM timestamp semantics'
          git push origin HEAD:refs/heads/fix/utcnow-warning-gate-20260924
