name: Patch MDT auto manager

on:
  push:
    branches: [feat/mdt-auto-manager]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mdt-auto-manager
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch and test
        run: |
          set -Eeuo pipefail
          python scripts/patch_mdt_auto_manager.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_vk_mdt_write.py")
          text = path.read_text(encoding="utf-8")
          old = '''"""Focused coverage for VK -> MDT CRM write behavior."""\n\nimport json\n\nimport vk_bot as bot\n'''
          new = '''"""Focused coverage for VK -> MDT CRM write behavior."""\n\nimport json\nimport os\nimport tempfile\n\nos.environ.setdefault("VK_ACCESS_TOKEN", "dummy-token")\nos.environ.setdefault("VK_GROUP_ID", "999")\nos.environ.setdefault("VK_CONFIRMATION", "confirm123")\nos.environ.setdefault("VK_SECRET_KEY", "vk-test-secret")\nos.environ.setdefault("TUTU_ENABLED", "false")\nos.environ.setdefault("VK_DEMO_MODE", "false")\nos.environ.setdefault("ADMIN_ID", "999")\nos.environ.setdefault("DIALOG_TIMEOUT_HOURS", "0")\nos.environ.setdefault("SYNC_COMPLETION", "true")\nos.environ.setdefault("VK_MDT_RETRY_ENABLED", "false")\nos.environ.setdefault("AI_MODE", "template")\nos.environ.setdefault("CONSENT_MODE", "strict")\nos.environ["DATABASE_PATH"] = os.path.join(\n    tempfile.gettempdir(), f"vk_turbot_test_{os.getpid()}.sqlite"\n)\n\nimport vk_bot as bot\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'os.environ.setdefault("VK_CONFIRMATION", "confirm123")' not in text:
              raise SystemExit("VK MDT test header anchor not found")
          path.write_text(text, encoding="utf-8")
          PY
          pytest -q tests/test_shared.py tests/test_vk_mdt_write.py tests/test_vk_bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/mdt.py vk_bot.py deploy/turbot-deploy.sh deploy/verify-mdt.sh docs/vk_mdt_write.md .env.example tests/test_shared.py tests/test_vk_mdt_write.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assign sole active MDT manager to VK preorders"
          git push origin HEAD:feat/mdt-auto-manager
