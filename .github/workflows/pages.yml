name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published TurBot site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}"
          rev="${GITHUB_SHA}"

          fetch_page() {
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$1" || true
          }

          for attempt in {1..12}; do
            home="$(fetch_page "$root/?rev=$rev")"
            canonical="$(fetch_page "$root/apreltour/?rev=$rev")"
            privacy="$(fetch_page "$root/apreltour/privacy.html?rev=$rev")"
            consent="$(fetch_page "$root/apreltour/consent.html?rev=$rev")"
            robots="$(fetch_page "$root/robots.txt?rev=$rev")"
            sitemap="$(fetch_page "$root/sitemap.xml?rev=$rev")"

            if grep -q 'TurBot × АПРЕЛЬ тур' <<<"$home" &&
               grep -q 'Наталья Ильина' <<<"$canonical" &&
               grep -q 'data-turbot-link' <<<"$canonical" &&
               grep -q 'rel="canonical"' <<<"$canonical" &&
               grep -q 'Политика обработки персональных данных' <<<"$privacy" &&
               grep -q 'ИП Замятина Мария Андреевна' <<<"$privacy" &&
               grep -q 'ИП Замятина Мария Андреевна' <<<"$consent" &&
               ! grep -q 'ЧЕРНОВИК / ШАБЛОН' <<<"$privacy" &&
               ! grep -q '\[указать' <<<"$privacy" &&
               ! grep -q '\[указать' <<<"$consent" &&
               grep -q 'Sitemap: https://r0meo1.ru/sitemap.xml' <<<"$robots" &&
               grep -q 'https://r0meo1.ru/apreltour/' <<<"$sitemap"; then
              echo "TurBot Pages smoke: ok"
              break
            fi

            if [[ "$attempt" == "12" ]]; then
              check() {
                local name="$1"
                shift
                if "$@"; then
                  echo "$name=ok" >&2
                else
                  echo "$name=fail" >&2
                fi
              }
              check page_home grep -q 'TurBot × АПРЕЛЬ тур' <<<"$home"
              check page_canonical_manager grep -q 'Наталья Ильина' <<<"$canonical"
              check page_canonical_link grep -q 'data-turbot-link' <<<"$canonical"
              check page_canonical_tag grep -q 'rel="canonical"' <<<"$canonical"
              check page_privacy_title grep -q 'Политика обработки персональных данных' <<<"$privacy"
              check page_privacy_operator grep -q 'ИП Замятина Мария Андреевна' <<<"$privacy"
              check page_consent_operator grep -q 'ИП Замятина Мария Андреевна' <<<"$consent"
              absent() { ! grep -Fq "$1"; }
              check page_privacy_no_draft absent 'ЧЕРНОВИК / ШАБЛОН' <<<"$privacy"
              check page_privacy_no_placeholder absent '[указать' <<<"$privacy"
              check page_consent_no_placeholder absent '[указать' <<<"$consent"
              check page_robots_sitemap grep -Fq 'Sitemap: https://r0meo1.ru/sitemap.xml' <<<"$robots"
              check page_sitemap_canonical grep -Fq 'https://r0meo1.ru/apreltour/' <<<"$sitemap"
              echo "TurBot Pages smoke failed; only boolean diagnostics are shown" >&2
              exit 1
            fi

            echo "Published TurBot site not ready yet (attempt $attempt/12)"
            sleep 5
          done

      - name: Verify published Telegram Mini App
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/miniapp"

          for attempt in {1..12}; do
            html="$(curl -fsSL --max-time 15 "$base/" || true)"
            js="$(curl -fsSL --max-time 15 "$base/app.js" || true)"

            if grep -q 'trip-form' <<<"$html" &&
               grep -q "budgetScope: 'total'" <<<"$js" &&
               grep -q "source: 'telegram_mini_app'" <<<"$js"; then
              echo "Telegram Mini App Pages smoke: ok"
              exit 0
            fi

            echo "Published Mini App not ready yet (attempt $attempt/12)"
            sleep 5
          done

          echo "Telegram Mini App Pages smoke failed" >&2
          exit 1
