name: Fix VK Tourvisor live fallback

on:
  push:
    paths:
      - '.github/workflows/fix-vk-tourvisor-live-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard live Tourvisor search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('vk_bot.py')
          text = path.read_text(encoding='utf-8')

          old_fallback = '''    combined = [offer for result in results for offer in result.offers]\n    if not combined:\n        dest_val = snapshot.get("destination") or ""\n        combined = _tourvisor.get_hot_tours(\n            snapshot.get("origin") or "Архангельск",\n            destination=dest_val,\n            limit=TOURVISOR_MAX_OFFERS,\n        )\n'''
          new_fallback = '''    combined = [offer for result in results for offer in result.offers]\n    # Curated offers are demo fixtures, never a substitute for an empty or\n    # failed upstream search in the live agency funnel.\n    if not combined and DEMO_MODE:\n        dest_val = snapshot.get("destination") or ""\n        combined = _tourvisor.get_hot_tours(\n            snapshot.get("origin") or "Архангельск",\n            destination=dest_val,\n            limit=TOURVISOR_MAX_OFFERS,\n        )\n'''
          if text.count(old_fallback) != 1:
              raise SystemExit('expected exactly one live-search fallback anchor')
          text = text.replace(old_fallback, new_fallback, 1)

          token_guard_anchor = '''TOURVISOR_ENABLED = os.getenv(\n    "VK_TOURVISOR_ENABLED", "true" if TOURVISOR_TOKEN else "false"\n).lower().strip() in ("1", "true", "yes")\n'''
          token_guard_replacement = token_guard_anchor + '''if TOURVISOR_ENABLED and not TOURVISOR_TOKEN:\n    logger.warning("VK Tourvisor requested but TOURVISOR_TOKEN is empty; disabling live search")\n    TOURVISOR_ENABLED = False\n'''
          if text.count(token_guard_anchor) != 1:
              raise SystemExit('expected exactly one Tourvisor enabled anchor')
          text = text.replace(token_guard_anchor, token_guard_replacement, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_vk_live_tour_safety.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef test_live_tour_search_cannot_fall_back_to_curated_demo_offers():\n    source = Path("vk_bot.py").read_text(encoding="utf-8")\n    assert "if not combined and DEMO_MODE:" in source\n    assert "if not combined:\\n        dest_val = snapshot.get(\\\"destination\\\")" not in source\n\n\ndef test_vk_tourvisor_requires_a_real_token_when_enabled():\n    source = Path("vk_bot.py").read_text(encoding="utf-8")\n    assert "if TOURVISOR_ENABLED and not TOURVISOR_TOKEN:" in source\n    assert "TOURVISOR_ENABLED = False" in source\n''', encoding='utf-8')
          PY

      - name: Run regression suite
        run: |
          python -m pip install -r requirements.txt pytest
          pytest -q

      - name: Commit guarded patch and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-vk-tourvisor-live-fallback.yml
          git add vk_bot.py tests/test_vk_live_tour_safety.py
          git commit -m 'Prevent demo tours from leaking into live VK search'
          git push origin HEAD:main
