name: Patch MDT retry

on:
  push:
    branches: [fix/vk-mdt-durable-retry]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-mdt-durable-retry
          fetch-depth: 0
      - name: Apply durable MDT retry changes
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return False
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          replace_once('shared/mdt.py',
              '    selected = info.get("selected_tour")\n    if isinstance(selected, dict):',
              '    delivery_key = str(info.get("_mdt_delivery_key") or "").strip()\n    if delivery_key:\n        fields.append({"name": "ID заявки бота", "values": [delivery_key]})\n\n    selected = info.get("selected_tour")\n    if isinstance(selected, dict):')
          replace_once('shared/mdt.py',
              ') -> None:\n    """Send completed bot request to MDT according to settings.mode."""\n    if not settings.enabled:\n        return\n',
              ') -> bool:\n    """Send a completed request to MDT and report whether a write succeeded."""\n    if not settings.enabled:\n        return False\n')
          replace_once('shared/mdt.py',
              '    if success and settings.notify_managers:\n        notify_managers(\n            settings, chat_id, info, phone, client_name, request_fn, log=log\n        )\n',
              '    if success and settings.notify_managers:\n        notify_managers(\n            settings, chat_id, info, phone, client_name, request_fn, log=log\n        )\n    return success\n')

          replace_once('vk_bot.py',
              'MDT_REMINDER_TEXT = os.getenv("MDT_REMINDER_TEXT", "Позвонить по заявке с VK-бота")\n\nif MDT_MODE not in ("lead", "preorder", "both"):',
              'MDT_REMINDER_TEXT = os.getenv("MDT_REMINDER_TEXT", "Позвонить по заявке с VK-бота")\nMDT_RETRY_ENABLED = os.getenv("VK_MDT_RETRY_ENABLED", "true").lower().strip() in ("1", "true", "yes")\nMDT_RETRY_POLL_SECONDS = max(5, _env_int("VK_MDT_RETRY_POLL_SECONDS", 60))\nMDT_RETRY_BASE_SECONDS = max(5, _env_int("VK_MDT_RETRY_BASE_SECONDS", 60))\nMDT_RETRY_MAX_SECONDS = max(MDT_RETRY_BASE_SECONDS, _env_int("VK_MDT_RETRY_MAX_SECONDS", 3600))\nMDT_RETRY_BATCH_SIZE = max(1, _env_int("VK_MDT_RETRY_BATCH_SIZE", 10))\n\nif MDT_MODE not in ("lead", "preorder", "both"):')

          replace_once('vk_bot.py',
              '                selected_tour TEXT,\n                created_at INTEGER NOT NULL\n            )',
              '                selected_tour TEXT,\n                mdt_status TEXT,\n                mdt_attempts INTEGER NOT NULL DEFAULT 0,\n                mdt_next_retry_at INTEGER,\n                mdt_synced_at INTEGER,\n                created_at INTEGER NOT NULL\n            )')
          replace_once('vk_bot.py',
              '            for _c in ("source", "vk_ref", "vk_platform"):\n                if _c not in _cols:\n                    cur.execute(f"ALTER TABLE {_t} ADD COLUMN {_c} TEXT")\n        cur.execute("CREATE INDEX IF NOT EXISTS idx_leads_chat_id ON leads(chat_id)")',
              '            for _c in ("source", "vk_ref", "vk_platform"):\n                if _c not in _cols:\n                    cur.execute(f"ALTER TABLE {_t} ADD COLUMN {_c} TEXT")\n            if _t == "leads":\n                if "mdt_status" not in _cols:\n                    cur.execute("ALTER TABLE leads ADD COLUMN mdt_status TEXT")\n                if "mdt_attempts" not in _cols:\n                    cur.execute("ALTER TABLE leads ADD COLUMN mdt_attempts INTEGER NOT NULL DEFAULT 0")\n                if "mdt_next_retry_at" not in _cols:\n                    cur.execute("ALTER TABLE leads ADD COLUMN mdt_next_retry_at INTEGER")\n                if "mdt_synced_at" not in _cols:\n                    cur.execute("ALTER TABLE leads ADD COLUMN mdt_synced_at INTEGER")\n        cur.execute("CREATE INDEX IF NOT EXISTS idx_leads_chat_id ON leads(chat_id)")')
          replace_once('vk_bot.py',
              '        cur.execute("CREATE INDEX IF NOT EXISTS idx_leads_created_at ON leads(created_at)")\n        cur.execute("PRAGMA journal_mode=WAL")',
              '        cur.execute("CREATE INDEX IF NOT EXISTS idx_leads_created_at ON leads(created_at)")\n        cur.execute("CREATE INDEX IF NOT EXISTS idx_leads_mdt_retry ON leads(mdt_status, mdt_next_retry_at)")\n        cur.execute("PRAGMA journal_mode=WAL")')

          replace_once('vk_bot.py',
              ') -> None:\n    """Persist a completed tour request for retention-aware export/history."""\n    now = int(time.time())\n    if DEMO_MODE:\n        phone = _tutu_mask_phone(phone)\n    with _db_cursor(commit=True) as cur:',
              ') -> int:\n    """Persist a completed request and return its durable local lead id."""\n    now = int(time.time())\n    if DEMO_MODE:\n        phone = _tutu_mask_phone(phone)\n    mdt_status = "pending" if MDT_ENABLED and not DEMO_MODE else "disabled"\n    mdt_next_retry_at = now if mdt_status == "pending" else None\n    with _db_cursor(commit=True) as cur:')
          replace_once('vk_bot.py',
              '                needs_consultation, selected_tour, created_at\n            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
              '                needs_consultation, selected_tour,\n                mdt_status, mdt_attempts, mdt_next_retry_at, mdt_synced_at, created_at\n            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)')
          replace_once('vk_bot.py',
              '                _tour_to_db(info.get("selected_tour")),\n                now,\n            ),\n        )\n\n\n# --- user helpers ---',
              '                _tour_to_db(info.get("selected_tour")),\n                mdt_status, 0, mdt_next_retry_at, None, now,\n            ),\n        )\n        return int(cur.lastrowid)\n\n\ndef _lead_row_to_info(row: Dict[str, Any]) -> Dict[str, Any]:\n    info = dict(row)\n    info["kids_ages"] = _ages_from_db(info.get("kids_ages"))\n    info["needs_consultation"] = bool(info.get("needs_consultation"))\n    if info.get("dates_are_trip") is not None:\n        info["dates_are_trip"] = bool(info["dates_are_trip"])\n    info["selected_tour"] = _tour_from_db(info.get("selected_tour"))\n    info["_mdt_delivery_key"] = f"vk-lead-{info[\'id\']}"\n    return info\n\n\n# --- user helpers ---')

          replace_once('vk_bot.py',
              'def send_lead_to_mdt(chat_id, info, phone, client_name) -> None:\n    mdt_shared.dispatch_lead(\n',
              'def send_lead_to_mdt(chat_id, info, phone, client_name) -> bool:\n    return mdt_shared.dispatch_lead(\n')

          replace_once('vk_bot.py', '\n\ndef _consent_text() -> str:\n', '''\n\n_mdt_delivery_lock = threading.Lock()\n\n\ndef _mdt_retry_delay(attempts: int) -> int:\n    exponent = max(0, min(int(attempts) - 1, 16))\n    return min(MDT_RETRY_MAX_SECONDS, MDT_RETRY_BASE_SECONDS * (2 ** exponent))\n\n\ndef _deliver_mdt_lead(lead_id: int) -> bool:\n    if not MDT_ENABLED or DEMO_MODE:\n        return True\n    with _mdt_delivery_lock:\n        with _db_cursor() as cur:\n            cur.execute("SELECT * FROM leads WHERE id = ?", (lead_id,))\n            row = cur.fetchone()\n        if row is None:\n            return True\n        record = dict(row)\n        if record.get("mdt_status") in ("synced", "disabled"):\n            return True\n        info = _lead_row_to_info(record)\n        try:\n            success = bool(send_lead_to_mdt(\n                int(record["chat_id"]), info, str(record.get("phone") or ""),\n                record.get("first_name") or f"VK {record[\'chat_id\']}",\n            ))\n        except Exception as exc:\n            logger.error("MDT durable delivery crashed for lead %s: %s", lead_id, exc)\n            success = False\n        now = int(time.time())\n        if success:\n            with _db_cursor(commit=True) as cur:\n                cur.execute(\n                    "UPDATE leads SET mdt_status=\'synced\', mdt_synced_at=?, "\n                    "mdt_next_retry_at=NULL WHERE id=?", (now, lead_id))\n            logger.info("MDT durable delivery synced local lead %s", lead_id)\n            return True\n        attempts = int(record.get("mdt_attempts") or 0) + 1\n        next_retry = now + _mdt_retry_delay(attempts)\n        with _db_cursor(commit=True) as cur:\n            cur.execute(\n                "UPDATE leads SET mdt_status=\'pending\', mdt_attempts=?, "\n                "mdt_next_retry_at=? WHERE id=?", (attempts, next_retry, lead_id))\n        logger.warning(\n            "MDT delivery pending for local lead %s (attempt %s, retry in %ss)",\n            lead_id, attempts, max(0, next_retry - now))\n        return False\n\n\ndef _retry_pending_mdt_leads() -> int:\n    if not MDT_ENABLED or not MDT_RETRY_ENABLED or DEMO_MODE:\n        return 0\n    now = int(time.time())\n    with _db_cursor() as cur:\n        cur.execute(\n            "SELECT id FROM leads WHERE mdt_status=\'pending\' "\n            "AND COALESCE(mdt_next_retry_at, 0) <= ? ORDER BY id LIMIT ?",\n            (now, MDT_RETRY_BATCH_SIZE))\n        ids = [int(row[0]) for row in cur.fetchall()]\n    synced = 0\n    for lead_id in ids:\n        if _deliver_mdt_lead(lead_id):\n            synced += 1\n    return synced\n\n\ndef _start_mdt_retry_worker() -> None:\n    if not MDT_ENABLED or not MDT_RETRY_ENABLED or DEMO_MODE:\n        return\n    def _worker() -> None:\n        while True:\n            try:\n                _retry_pending_mdt_leads()\n            except Exception as exc:\n                logger.error("MDT retry worker failed: %s", exc)\n            time.sleep(MDT_RETRY_POLL_SECONDS)\n    threading.Thread(target=_worker, daemon=True, name="vk-mdt-retry").start()\n    logger.info("MDT retry worker started (%ss poll)", MDT_RETRY_POLL_SECONDS)\n\n\ndef _consent_text() -> str:\n''')

          replace_once('vk_bot.py',
              'def _post_completion_side_effects(\n    user_id: int,\n    info: Dict[str, Any],\n    phone: str,\n    client_name: Optional[str],\n) -> None:',
              'def _post_completion_side_effects(\n    user_id: int,\n    info: Dict[str, Any],\n    phone: str,\n    client_name: Optional[str],\n    lead_id: Optional[int] = None,\n) -> None:')
          replace_once('vk_bot.py',
              '    try:\n        send_lead_to_mdt(user_id, info, phone, client_name)\n\n        # The client already chose a complete package.',
              '    try:\n        if lead_id is not None:\n            _deliver_mdt_lead(lead_id)\n        elif MDT_ENABLED and not DEMO_MODE:\n            send_lead_to_mdt(user_id, info, phone, client_name)\n\n        # The client already chose a complete package.')
          replace_once('vk_bot.py',
              '    try:\n        save_lead(user_id, info, phone, first_name=client_name)\n    except Exception as exc:\n        logger.error("Failed to save VK lead for %s: %s", user_id, exc)\n',
              '    lead_id: Optional[int] = None\n    try:\n        lead_id = save_lead(user_id, info, phone, first_name=client_name)\n    except Exception as exc:\n        logger.error("Failed to save VK lead for %s: %s", user_id, exc)\n')
          replace_once('vk_bot.py',
              '        _post_completion_side_effects(user_id, info, phone, client_name)\n    else:\n        threading.Thread(\n            target=_post_completion_side_effects,\n            args=(user_id, info, phone, client_name),',
              '        _post_completion_side_effects(user_id, info, phone, client_name, lead_id)\n    else:\n        threading.Thread(\n            target=_post_completion_side_effects,\n            args=(user_id, info, phone, client_name, lead_id),')
          replace_once('vk_bot.py',
              'load_state()\n_start_timeout_worker()\n_start_followup_worker()\n_start_retention_worker()\n',
              'load_state()\n_start_timeout_worker()\n_start_followup_worker()\n_start_retention_worker()\n_start_mdt_retry_worker()\n')

          replace_once('tests/test_vk_bot.py',
              'os.environ.setdefault("SYNC_COMPLETION", "true")  # run MDT/AI inline in tests\n',
              'os.environ.setdefault("SYNC_COMPLETION", "true")  # run MDT/AI inline in tests\nos.environ.setdefault("VK_MDT_RETRY_ENABLED", "false")\n')
          tests = Path('tests/test_vk_bot.py')
          text = tests.read_text(encoding='utf-8')
          if 'def test_mdt_durable_retry_survives_failure_and_restart_state(' not in text:
              text += '''\n\ndef test_mdt_durable_retry_survives_failure_and_restart_state(monkeypatch):\n    bot.MDT_ENABLED = True\n    bot.MDT_RETRY_ENABLED = True\n    bot.MDT_RETRY_BASE_SECONDS = 5\n    bot.MDT_RETRY_MAX_SECONDS = 60\n    bot.MDT_RETRY_BATCH_SIZE = 10\n    info = {"destination": "Таиланд", "origin": "Архангельск", "dates": "2026-10-15",\n            "nights": "10", "people": "2", "budget": 270000, "budget_scope": "total",\n            "selected_tour": {"hotel": "Mandarava Resort & Spa Karon Beach",\n                              "date": "2026-10-15", "nights": 10, "meal": "BB",\n                              "price": 155000, "tour_id": "th-6"}}\n    lead_id = bot.save_lead(31771632, info, "vk:31771632", first_name="Роман Неклюдов")\n    with bot._db_cursor() as cur:\n        row = cur.execute("SELECT mdt_status, mdt_attempts FROM leads WHERE id=?", (lead_id,)).fetchone()\n    assert tuple(row) == ("pending", 0)\n    calls = []\n    monkeypatch.setattr(bot, "send_lead_to_mdt",\n        lambda chat_id, payload, phone, name: calls.append((chat_id, payload, phone, name)) or False)\n    assert bot._deliver_mdt_lead(lead_id) is False\n    with bot._db_cursor() as cur:\n        row = cur.execute("SELECT mdt_status, mdt_attempts, mdt_next_retry_at FROM leads WHERE id=?", (lead_id,)).fetchone()\n    assert row["mdt_status"] == "pending"\n    assert row["mdt_attempts"] == 1\n    assert row["mdt_next_retry_at"] > int(time.time())\n    assert calls[0][1]["_mdt_delivery_key"] == f"vk-lead-{lead_id}"\n    with bot._db_cursor(commit=True) as cur:\n        cur.execute("UPDATE leads SET mdt_next_retry_at=0 WHERE id=?", (lead_id,))\n    monkeypatch.setattr(bot, "send_lead_to_mdt", lambda *a, **k: True)\n    assert bot._retry_pending_mdt_leads() == 1\n    with bot._db_cursor() as cur:\n        row = cur.execute("SELECT mdt_status, mdt_attempts, mdt_next_retry_at, mdt_synced_at FROM leads WHERE id=?", (lead_id,)).fetchone()\n    assert row["mdt_status"] == "synced"\n    assert row["mdt_attempts"] == 1\n    assert row["mdt_next_retry_at"] is None\n    assert row["mdt_synced_at"] > 0\n\n\ndef test_mdt_retry_does_not_repeat_client_or_manager_notifications(monkeypatch):\n    bot.MDT_ENABLED = True\n    bot.MDT_RETRY_ENABLED = True\n    lead_id = bot.save_lead(777, {"destination": "Египет", "people": "2", "budget": 200000}, "vk:777", first_name="Test User")\n    with bot._db_cursor(commit=True) as cur:\n        cur.execute("UPDATE leads SET mdt_next_retry_at=0 WHERE id=?", (lead_id,))\n    monkeypatch.setattr(bot, "_confirm_to_user", lambda *a, **k: pytest.fail("retry must not contact client"))\n    monkeypatch.setattr(bot, "_notify_admin", lambda *a, **k: pytest.fail("retry must not notify manager"))\n    monkeypatch.setattr(bot, "send_lead_to_mdt", lambda *a, **k: True)\n    assert bot._retry_pending_mdt_leads() == 1\n\n\ndef test_mdt_delivery_key_is_in_add_lead_fields(monkeypatch):\n    bot.MDT_ENABLED = True\n    bot.MDT_MODE = "lead"\n    bot.MDT_API_KEY = "test-key"\n    bot.MDT_BASE_URL = "https://example.invalid"\n    calls = []\n    monkeypatch.setattr(bot, "_mdt_request", lambda method, params: calls.append((method, params)) or {"id": 1})\n    assert bot.send_lead_to_mdt(42, {"destination": "Таиланд", "_mdt_delivery_key": "vk-lead-123"}, "vk:42", "Роман") is True\n    assert calls[0][0] == "add-lead"\n    assert {"name": "ID заявки бота", "values": ["vk-lead-123"]} in calls[0][1]["fields"]\n'''
              tests.write_text(text, encoding='utf-8')

          replace_once('.env.example',
              'MDT_REMINDER_TEXT="Позвонить по заявке с Telegram-бота"\n',
              'MDT_REMINDER_TEXT="Позвонить по заявке с Telegram-бота"\n\n# VK durable MDT delivery: failed CRM writes stay in SQLite and retry with backoff.\n# VK_MDT_RETRY_ENABLED=true\n# VK_MDT_RETRY_POLL_SECONDS=60\n# VK_MDT_RETRY_BASE_SECONDS=60\n# VK_MDT_RETRY_MAX_SECONDS=3600\n# VK_MDT_RETRY_BATCH_SIZE=10\n# VK_MDT_SOURCE="VK Bot"\n')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/mdt.py vk_bot.py tests/test_vk_bot.py .env.example
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add durable MDT retry outbox"
          git push origin HEAD:fix/vk-mdt-durable-retry
