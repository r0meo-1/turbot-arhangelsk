name: Patch VK MDT preorder ops

on:
  push:
    branches:
      - "work/vk-mdt-preorder-ops"
    paths:
      - ".github/vk-mdt-preorder-ops.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/vk-mdt-preorder-ops
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_patch_vk_mdt_preorder_ops.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Commit clean patch
        shell: bash
        run: |
          rm -f .github/workflows/tmp-vk-mdt-preorder-ops.yml
          rm -f .github/vk-mdt-preorder-ops.trigger
          rm -f scripts/_patch_vk_mdt_preorder_ops.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose and alert VK MDT preorder failures"
          git push origin HEAD:work/vk-mdt-preorder-ops
