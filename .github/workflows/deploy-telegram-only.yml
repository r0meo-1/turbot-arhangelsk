name: Deploy Telegram only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turbot-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.VK_MODERATION_FREEZE == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/regression
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust the pinned production host key
        env:
          HOST_KEYS: ${{ vars.TURBOT_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$HOST_KEYS"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy only Telegram bot.py against unchanged runtime dependencies
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: python deploy/send-telegram-only.py "$GITHUB_SHA"
      - name: Verify Telegram revision
        run: python deploy/verify_revision.py --expected "$GITHUB_SHA"
