name: One-shot VK Mini App SQLite resume patch

on:
  push:
    branches: [fix/vk-miniapp-resume-from-sqlite]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-miniapp-resume-from-sqlite

      - name: Restore Mini App review from SQLite
        env:
          OLD_GET_B64: 
          NEW_GET_B64: 
          OLD_MENU_B64: 
          NEW_MENU_B64: 
          OLD_HANDLE_B64: ZGVmIGhhbmRsZV9kaWFsb2codXNlcl9pZDogaW50LCB0ZXh0OiBzdHIsIG1lc3NhZ2U6IERpY3Rbc3RyLCBBbnldKSAtPiBOb25lOgogICAgaW5mbyA9IHVzZXJfZGF0YS5nZXQodXNlcl9pZCwge30pCiAgICBzdGF0ZSA9IGluZm8uZ2V0KCJzdGF0ZSIpCg==
          NEW_HANDLE_B64: ZGVmIGhhbmRsZV9kaWFsb2codXNlcl9pZDogaW50LCB0ZXh0OiBzdHIsIG1lc3NhZ2U6IERpY3Rbc3RyLCBBbnldKSAtPiBOb25lOgogICAgaW5mbyA9IHVzZXJfZGF0YS5nZXQodXNlcl9pZCkgb3IgX3Jlc3RvcmVfc2Vzc2lvbl9mcm9tX2RiKHVzZXJfaWQpIG9yIHt9CiAgICBzdGF0ZSA9IGluZm8uZ2V0KCJzdGF0ZSIpCg==
          OLD_TEST_B64: ICAgIHVzZXJfaWQgPSA0MjQyNDIKICAgIGJvdC51c2VyX2RhdGFbdXNlcl9pZF0gPSB7InN0YXRlIjogYm90LlNUQVRFX1JFVklFV30KICAgIHByb21wdGVkID0gW10K
          NEW_TEST_B64: 
          OLD_FINALLY_B64: ICAgIGZpbmFsbHk6CiAgICAgICAgYm90LnVzZXJfZGF0YS5wb3AodXNlcl9pZCwgTm9uZSkK
          NEW_FINALLY_B64: ICAgIGZpbmFsbHk6CiAgICAgICAgYm90LnVzZXJfZGF0YS5wb3AodXNlcl9pZCwgTm9uZSkKICAgICAgICBib3QuZGVsZXRlX3Nlc3Npb24odXNlcl9pZCkK
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def decode(name):
              return base64.b64decode(os.environ[name + "_B64"]).decode("utf-8")

          path = Path("vk_bot.py")
          text = path.read_text(encoding="utf-8")
          for old_name, new_name in [
              ("OLD_GET", "NEW_GET"),
              ("OLD_MENU", "NEW_MENU"),
              ("OLD_HANDLE", "NEW_HANDLE"),
          ]:
              old = decode(old_name)
              new = decode(new_name)
              if text.count(old) != 1:
                  raise SystemExit(f"{old_name} count={text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_vk_miniapp_review_return.py")
          tests = test_path.read_text(encoding="utf-8")
          for old_name, new_name in [
              ("OLD_TEST", "NEW_TEST"),
              ("OLD_FINALLY", "NEW_FINALLY"),
          ]:
              old = decode(old_name)
              new = decode(new_name)
              if tests.count(old) != 1:
                  raise SystemExit(f"{old_name} count={tests.count(old)}")
              tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused tests
        run: |
          python -m pytest -q tests/test_vk_miniapp_review_return.py tests/test_vk_bot.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py tests/test_vk_miniapp_review_return.py
          git commit -m "Restore VK Mini App reviews from SQLite"
          git push
