name: Patch VK CRM status

on:
  push:
    branches: [feat/vk-crm-status]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/vk-crm-status
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Apply patch and test
        run: |
          python scripts/patch_vk_crm_status.py
          pytest -q tests/test_vk_bot.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vk_bot.py tests/test_vk_bot.py
          git diff --cached --check
          git commit -m "Add safe VK CRM status command"
          git push origin HEAD:feat/vk-crm-status
