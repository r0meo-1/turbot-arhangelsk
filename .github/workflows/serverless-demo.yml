name: Serverless demo
on:
  pull_request:
    paths: ['serverless-demo/**', '.github/workflows/serverless-demo.yml']
  push:
    paths: ['serverless-demo/**', '.github/workflows/serverless-demo.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test serverless-demo/tests/*.test.js
