# Keep a free-tier Render demo awake (spins down after ~15 min idle).
#
# DISABLED by default — free instance hours (~750/mo) are better saved.
# Cold start (~30–60s) is fine for demos; open /health once before a live demo.
#
# To re-enable:
#   1) gh workflow enable "Keep-alive (Render demo)"
#   2) Secret RENDER_HEALTH_URL = https://YOUR-SERVICE.onrender.com/health
#   3) Uncomment the schedule block below (or use workflow_dispatch only).
#
# ⚠️ Demo only. Do not collect real RF personal data on Render (152-ФЗ).

name: Keep-alive (Render demo)

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:  # manual only while keep-alive is off

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::notice::Secret RENDER_HEALTH_URL is not set — skip. Add it to enable keep-alive."
            exit 0
          fi
          echo "GET $URL"
          # Retries help if Render is cold-starting.
          for i in 1 2 3; do
            if curl -fsS --max-time 45 -o /tmp/health.json -w "HTTP %{http_code} in %{time_total}s\n" "$URL"; then
              head -c 400 /tmp/health.json || true
              echo
              exit 0
            fi
            echo "attempt $i failed, retry in 10s..."
            sleep 10
          done
          echo "::warning::Health check failed after retries (service may still wake on next request)"
          exit 0
