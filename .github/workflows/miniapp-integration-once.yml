name: Apply Mini App backend integration

on:
  push:
    branches:
      - feat/miniapp-web-app-data
    paths:
      - .github/workflows/miniapp-integration-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic bot patch
        run: python .github/scripts/apply_miniapp_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Commit backend integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --check
          git commit -m "Connect Mini App submissions to TurBot FSM"
          git push origin HEAD:feat/miniapp-web-app-data
