name: Patch MDT preorder delivery key

on:
  push:
    branches: [feat/mdt-auto-manager]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mdt-auto-manager
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch and test
        run: |
          set -Eeuo pipefail
          python scripts/patch_mdt_preorder_delivery_key.py
          pytest -q tests/test_shared.py tests/test_vk_mdt_write.py tests/test_vk_bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/mdt.py vk_bot.py tests/test_vk_mdt_write.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve VK delivery key in MDT preorder"
          git push origin HEAD:feat/mdt-auto-manager
