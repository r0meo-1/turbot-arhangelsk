name: Patch VK Mini App draft recovery

on:
  push:
    branches: [fix/vk-miniapp-draft-recovery]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-miniapp-draft-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply recovery patch and test
        run: |
          set -Eeuo pipefail
          python scripts/patch_vk_miniapp_recovery.py
          pytest -q tests/test_vk_bot.py -k 'miniapp_review_command_restores_snapshot_after_chat_navigation or miniapp_snapshot_is_removed_on_cancel'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py tests/test_vk_bot.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Protect VK Mini App review drafts"
          git push origin HEAD:fix/vk-miniapp-draft-recovery
