name: Enable VK app_payload

on:
  push:
    paths:
      - .github/workflows/enable-vk-app-payload.yml

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Enable guarded VK Callback app_payload
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${DEPLOY_HOST:-}"
          printf 'TURBOT_VK_CALLBACK_APP_PAYLOAD_V1\n' |
            ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              root@"$DEPLOY_HOST" true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
