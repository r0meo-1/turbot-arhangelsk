name: Refine MDT retry

on:
  push:
    branches: [fix/vk-mdt-durable-retry]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-mdt-durable-retry
          fetch-depth: 0
      - name: Refine retry semantics
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if old not in t:
                  if new in t: return
                  raise SystemExit(f'anchor missing: {path}: {old[:100]!r}')
              p.write_text(t.replace(old,new,1), encoding='utf-8')

          rep('vk_bot.py',
              '    mdt_status = "pending" if MDT_ENABLED and not DEMO_MODE else "disabled"\n',
              '    # Durable retry is intentionally scoped to add-lead mode. Retrying a\n    # multi-step preorder/both transaction without server-side idempotency can\n    # duplicate the part that already succeeded. Those modes keep the legacy\n    # one-shot path until MDT exposes an idempotency key or lookup API.\n    mdt_status = "pending" if MDT_ENABLED and MDT_MODE == "lead" and not DEMO_MODE else "disabled"\n')
          rep('vk_bot.py',
              '        if lead_id is not None:\n            _deliver_mdt_lead(lead_id)\n        elif MDT_ENABLED and not DEMO_MODE:\n            send_lead_to_mdt(user_id, info, phone, client_name)\n',
              '        if lead_id is not None and MDT_MODE == "lead":\n            _deliver_mdt_lead(lead_id)\n        elif MDT_ENABLED and not DEMO_MODE:\n            # preorder/both remain one-shot because their multi-call transaction\n            # cannot be retried safely without server-side idempotency.\n            send_lead_to_mdt(user_id, info, phone, client_name)\n')
          rep('vk_bot.py',
              '    def _worker() -> None:\n        while True:\n            try:\n                _retry_pending_mdt_leads()\n            except Exception as exc:\n                logger.error("MDT retry worker failed: %s", exc)\n            time.sleep(MDT_RETRY_POLL_SECONDS)\n',
              '    def _worker() -> None:\n        # Give startup network/config work a chance to finish before replaying\n        # rows left pending by a previous process.\n        time.sleep(MDT_RETRY_POLL_SECONDS)\n        while True:\n            try:\n                _retry_pending_mdt_leads()\n            except Exception as exc:\n                logger.error("MDT retry worker failed: %s", exc)\n            time.sleep(MDT_RETRY_POLL_SECONDS)\n')
          rep('.env.example',
              '# VK durable MDT delivery: failed CRM writes stay in SQLite and retry with backoff.\n',
              '# VK durable MDT delivery for MDT_MODE=lead: failed CRM writes stay in SQLite and retry with backoff.\n')

          p=Path('tests/test_vk_bot.py'); t=p.read_text(encoding='utf-8')
          t=t.replace('    bot.MDT_ENABLED = True\n    bot.MDT_RETRY_ENABLED = True\n    bot.MDT_RETRY_BASE_SECONDS = 5\n    bot.MDT_RETRY_MAX_SECONDS = 60\n    bot.MDT_RETRY_BATCH_SIZE = 10\n',
                      '    monkeypatch.setattr(bot, "MDT_ENABLED", True)\n    monkeypatch.setattr(bot, "MDT_MODE", "lead")\n    monkeypatch.setattr(bot, "MDT_RETRY_ENABLED", True)\n    monkeypatch.setattr(bot, "MDT_RETRY_BASE_SECONDS", 5)\n    monkeypatch.setattr(bot, "MDT_RETRY_MAX_SECONDS", 60)\n    monkeypatch.setattr(bot, "MDT_RETRY_BATCH_SIZE", 10)\n',1)
          t=t.replace('    bot.MDT_ENABLED = True\n    bot.MDT_RETRY_ENABLED = True\n    lead_id = bot.save_lead(777,',
                      '    monkeypatch.setattr(bot, "MDT_ENABLED", True)\n    monkeypatch.setattr(bot, "MDT_MODE", "lead")\n    monkeypatch.setattr(bot, "MDT_RETRY_ENABLED", True)\n    lead_id = bot.save_lead(777,',1)
          t=t.replace('    bot.MDT_ENABLED = True\n    bot.MDT_MODE = "lead"\n    bot.MDT_API_KEY = "test-key"\n    bot.MDT_BASE_URL = "https://example.invalid"\n',
                      '    monkeypatch.setattr(bot, "MDT_ENABLED", True)\n    monkeypatch.setattr(bot, "MDT_MODE", "lead")\n    monkeypatch.setattr(bot, "MDT_API_KEY", "test-key")\n    monkeypatch.setattr(bot, "MDT_BASE_URL", "https://example.invalid")\n',1)
          if 'def test_mdt_retry_is_not_armed_for_multistep_modes' not in t:
              t += '''\n\ndef test_mdt_retry_is_not_armed_for_multistep_modes(monkeypatch):\n    monkeypatch.setattr(bot, "MDT_ENABLED", True)\n    monkeypatch.setattr(bot, "MDT_MODE", "both")\n    lead_id = bot.save_lead(778, {"destination": "Турция"}, "vk:778", first_name="Test")\n    with bot._db_cursor() as cur:\n        row = cur.execute("SELECT mdt_status, mdt_next_retry_at FROM leads WHERE id=?", (lead_id,)).fetchone()\n    assert tuple(row) == ("disabled", None)\n'''
          p.write_text(t,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py tests/test_vk_bot.py .env.example
          git commit -m "Refine MDT retry safety"
          git push origin HEAD:fix/vk-mdt-durable-retry
