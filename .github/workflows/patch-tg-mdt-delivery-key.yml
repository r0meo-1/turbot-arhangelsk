name: Patch Telegram MDT delivery key

on:
  push:
    branches:
      - "work/tg-mdt-delivery-key"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/tg-mdt-delivery-key

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_path = Path("bot.py")
          source = bot_path.read_text(encoding="utf-8")

          start = source.index("def save_lead(")
          end = source.index("\ndef count_leads()", start)
          block = source[start:end]
          assert ") -> None:" in block
          block = block.replace(") -> None:", ") -> int:", 1)
          block = block.replace(
              '"""Persist a completed tour request for export/analytics."""',
              '"""Persist a completed tour request and return its local lead ID."""',
              1,
          )
          closing = "        )\n"
          pos = block.rfind(closing)
          assert pos >= 0
          pos += len(closing)
          block = block[:pos] + "        return int(cur.lastrowid)\n" + block[pos:]
          source = source[:start] + block + source[end:]

          old_save = "        save_lead(chat_id, info, phone, first_name=first_name, username=username)"
          new_save = "        lead_id = save_lead(chat_id, info, phone, first_name=first_name, username=username)"
          assert old_save in source
          source = source.replace(old_save, new_save, 1)

          confirm = "    _confirm_to_user(chat_id, info, phone)  # 1. Confirm to user"
          assert confirm in source
          source = source.replace(
              confirm,
              '    delivery_info = dict(info)\n    delivery_info["_mdt_delivery_key"] = f"tg-lead-{lead_id}"\n\n' + confirm,
              1,
          )

          sync_call = "_post_completion_side_effects(chat_id, info, phone, client_name)"
          assert sync_call in source
          source = source.replace(
              sync_call,
              "_post_completion_side_effects(chat_id, delivery_info, phone, client_name)",
              1,
          )
          async_args = "args=(chat_id, info, phone, client_name),"
          assert async_args in source
          source = source.replace(
              async_args,
              "args=(chat_id, delivery_info, phone, client_name),",
              1,
          )
          bot_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_bot.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "test_telegram_completion_passes_local_delivery_key_to_mdt"
          if test_name not in tests:
              tests += '''\n\ndef test_telegram_completion_passes_local_delivery_key_to_mdt(monkeypatch):\n    captured = {}\n    monkeypatch.setattr(\n        bot,\n        "_post_completion_side_effects",\n        lambda chat_id, info, phone, client_name: captured.update(\n            chat_id=chat_id, info=dict(info), phone=phone, client_name=client_name\n        ),\n    )\n    monkeypatch.setattr(bot, "_confirm_to_user", lambda *a, **k: None)\n    monkeypatch.setattr(bot, "_notify_admin", lambda *a, **k: None)\n\n    chat_id = 7301\n    bot.user_data[chat_id] = {\n        "state": bot.STATE_REVIEW,\n        "review_token": "delivery-key-token",\n        "destination": "Шри-Ланка",\n        "origin": "Москва",\n        "dates": "2026-10-16",\n        "nights": "10",\n        "people": "2",\n        "kids": 0,\n        "kids_ages": [],\n        "infants": 0,\n        "budget": 270000,\n        "budget_scope": "per_person",\n        "direct_only": True,\n        "phone": "Telegram @tester",\n    }\n\n    bot.handle_completion(\n        chat_id,\n        "Telegram @tester",\n        {"from": {"first_name": "Roman", "username": "tester"}},\n        review_token="delivery-key-token",\n    )\n\n    with bot._db_cursor() as cur:\n        cur.execute("SELECT id FROM leads WHERE chat_id = ?", (chat_id,))\n        lead_id = cur.fetchone()[0]\n\n    assert captured["info"]["_mdt_delivery_key"] == f"tg-lead-{lead_id}"\n    assert captured["chat_id"] == chat_id\n    assert captured["phone"] == "Telegram @tester"\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Telegram bot tests
        run: python -m pytest tests/test_bot.py -q

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_bot.py
          git diff --cached --check
          git commit -m "Add Telegram MDT delivery key"
          git push origin HEAD:work/tg-mdt-delivery-key
