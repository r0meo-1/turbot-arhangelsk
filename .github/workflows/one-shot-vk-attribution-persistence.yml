name: One-shot VK attribution persistence patch

on:
  push:
    branches: [feat/vk-attribution-persistence]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/vk-attribution-persistence

      - name: Patch VK attribution persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vk_bot.py")
          text = path.read_text(encoding="utf-8")

          old = "                budget INTEGER,\n                budget_scope TEXT,\n                phone TEXT,\n"
          new = "                budget INTEGER,\n                budget_scope TEXT,\n                source TEXT,\n                vk_ref TEXT,\n                vk_platform TEXT,\n                phone TEXT,\n"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected sessions schema block count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "                budget INTEGER,\n                budget_scope TEXT,\n                phone TEXT NOT NULL,\n"
          new = "                budget INTEGER,\n                budget_scope TEXT,\n                source TEXT,\n                vk_ref TEXT,\n                vk_platform TEXT,\n                phone TEXT NOT NULL,\n"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected leads schema block count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "            if \"budget_scope\" not in _cols:\n                cur.execute(f\"ALTER TABLE {_t} ADD COLUMN budget_scope TEXT\")\n"
          new = "            if \"budget_scope\" not in _cols:\n                cur.execute(f\"ALTER TABLE {_t} ADD COLUMN budget_scope TEXT\")\n            for _c in (\"source\", \"vk_ref\", \"vk_platform\"):\n                if _c not in _cols:\n                    cur.execute(f\"ALTER TABLE {_t} ADD COLUMN {_c} TEXT\")\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected migration block")
          text = text.replace(old, new, 1)

          old = "                                  kids, kids_ages, infants, budget, budget_scope, phone,\n                                  needs_consultation, selected_tour, updated_at)\n            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n"
          new = "                                  kids, kids_ages, infants, budget, budget_scope,\n                                  source, vk_ref, vk_platform, phone,\n                                  needs_consultation, selected_tour, updated_at)\n            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected session insert block")
          text = text.replace(old, new, 1)

          old = "                budget=excluded.budget, budget_scope=excluded.budget_scope,\n                phone=excluded.phone,\n"
          new = "                budget=excluded.budget, budget_scope=excluded.budget_scope,\n                source=excluded.source, vk_ref=excluded.vk_ref,\n                vk_platform=excluded.vk_platform,\n                phone=excluded.phone,\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected session update block")
          text = text.replace(old, new, 1)

          old = "              data.get(\"infants\"), data.get(\"budget\"),\n              data.get(\"budget_scope\"), data.get(\"phone\"),\n"
          new = "              data.get(\"infants\"), data.get(\"budget\"),\n              data.get(\"budget_scope\"), data.get(\"source\"),\n              data.get(\"vk_ref\"), data.get(\"vk_platform\"), data.get(\"phone\"),\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected session values block")
          text = text.replace(old, new, 1)

          old = "                people, hotel_query, kids, kids_ages, infants, budget, budget_scope, phone,\n                needs_consultation, selected_tour, created_at\n            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n"
          new = "                people, hotel_query, kids, kids_ages, infants, budget, budget_scope,\n                source, vk_ref, vk_platform, phone,\n                needs_consultation, selected_tour, created_at\n            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected lead insert block")
          text = text.replace(old, new, 1)

          old = "                info.get(\"budget\"),\n                info.get(\"budget_scope\"),\n                phone,\n"
          new = "                info.get(\"budget\"),\n                info.get(\"budget_scope\"),\n                info.get(\"source\"),\n                info.get(\"vk_ref\"),\n                info.get(\"vk_platform\"),\n                phone,\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected lead values block")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_vk_bot.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\n\ndef test_validate_people():\n"
          addition = "\n\ndef test_miniapp_attribution_survives_session_and_lead():\n    from datetime import date, timedelta\n    from shared.vk_miniapp import validate_vk_trip\n\n    raw = dict(type=\"trip_request\", version=2, destination=\"Таиланд\", departure=\"Архангельск\",\n               date=(date.today() + timedelta(days=30)).isoformat(), nights=10, adults=2,\n               children=0, childrenAges=[], budgetMaxRub=270000, consent=True)\n    info = validate_vk_trip(raw)\n    info.update(vk_ref=\"community_messages\", vk_platform=\"desktop_web\")\n\n    bot._save_miniapp_draft(43, info)\n    saved = bot.get_session(43)\n    assert saved[\"source\"] == \"vk_mini_app\"\n    assert saved[\"vk_ref\"] == \"community_messages\"\n    assert saved[\"vk_platform\"] == \"desktop_web\"\n\n    bot.save_lead(43, saved, \"vk:43\")\n    with bot._db_cursor() as cur:\n        row = cur.execute(\n            \"SELECT source, vk_ref, vk_platform FROM leads WHERE chat_id=43\"\n        ).fetchone()\n    assert tuple(row) == (\"vk_mini_app\", \"community_messages\", \"desktop_web\")\n"
          if tests.count(marker) != 1:
              raise SystemExit("unexpected test insertion marker")
          test_path.write_text(tests.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_vk_bot.py tests/test_vk_miniapp.py tests/test_vk_miniapp_attribution.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py tests/test_vk_bot.py
          git commit -m "Persist VK Mini App attribution"
          git push origin HEAD:feat/vk-attribution-persistence
