name: Workflow Engine PostgreSQL

on:
  pull_request:
    paths:
      - "tools/workflow-engine/runtime/postgres/**"
      - ".github/workflows/workflow-engine-postgres.yml"
  push:
    branches: [main, master]
    paths:
      - "tools/workflow-engine/runtime/postgres/**"
      - ".github/workflows/workflow-engine-postgres.yml"
  merge_group:

permissions:
  contents: read

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workflow_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: workflow_schema_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U workflow_test -d workflow_schema_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKFLOW_POSTGRES_MIGRATION_URL: postgresql+psycopg://workflow_test:synthetic_ci_only@127.0.0.1:5432/workflow_schema_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r tools/workflow-engine/runtime/postgres/requirements.txt
      - name: Verify PostgreSQL schema lifecycle and invariants
        run: python -m pytest -q tools/workflow-engine/runtime/postgres/tests
