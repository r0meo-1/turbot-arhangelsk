name: One-shot VK E2E CI compatibility patch

on:
  push:
    branches: [ "main" ]
    paths:
      - .github/vk-e2e-importorskip-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch Playwright import for standard CI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_vk_miniapp_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = 'from flask import Flask\nfrom playwright.sync_api import sync_playwright\nfrom werkzeug.serving import make_server\n'
          new = 'import pytest\nfrom flask import Flask\nfrom werkzeug.serving import make_server\n\nplaywright_sync = pytest.importorskip("playwright.sync_api", reason="VK Mini App browser E2E runs in Edge Bot CI")\nsync_playwright = playwright_sync.sync_playwright\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected Playwright import block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_vk_miniapp_e2e.py
          git commit -m "Skip VK browser E2E when Playwright is unavailable"
          git push origin HEAD:main
