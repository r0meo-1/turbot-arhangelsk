name: Patch MDT lead acknowledgement

on:
  push:
    branches: [fix/mdt-lead-ack]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mdt-lead-ack
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch and test
        run: |
          set -Eeuo pipefail
          python scripts/patch_mdt_lead_ack.py
          pytest -q tests/test_shared.py -k 'create_lead'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/mdt.py tests/test_shared.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Require MDT lead acknowledgement"
          git push origin HEAD:fix/mdt-lead-ack
