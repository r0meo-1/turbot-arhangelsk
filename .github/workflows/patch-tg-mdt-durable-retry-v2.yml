name: Patch Telegram MDT durable retry v2

on:
  push:
    branches:
      - "work/tg-mdt-durable-retry"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/tg-mdt-durable-retry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_patch_tg_mdt_retry.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Commit durable retry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_bot.py .env.example
          git diff --cached --check
          git commit -m "Add durable Telegram MDT retry"
          git push origin HEAD:work/tg-mdt-durable-retry
