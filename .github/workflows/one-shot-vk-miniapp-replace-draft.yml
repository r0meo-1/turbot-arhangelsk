name: One-shot VK Mini App replace draft

on:
  push:
    branches: [fix/vk-miniapp-replace-draft]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-miniapp-replace-draft

      - name: Patch Mini App draft replacement behavior
        env:
          OF: 
          NF: 
          OS: 
          NS: ICAgICAgICBleGNlcHQgTWluaUFwcFZhbGlkYXRpb25FcnJvcjoKICAgICAgICAgICAgcmV0dXJuIGpzb25pZnkob2s9RmFsc2UsIGVycm9yPSLQl9Cw0Y/QstC60LAg0YPQttC1INC+0YLQv9GA0LDQstC70Y/QtdGC0YHRjy4g0J/QvtC00L7QttC00LjRgtC1INC90LXRgdC60L7Qu9GM0LrQviDRgdC10LrRg9C90LQg0Lgg0L/QvtCy0YLQvtGA0LjRgtC1LiIpLCA0MDkK
          OT1: 
          NT1: ICAgIGJvdC5fc2F2ZV9taW5pYXBwX2RyYWZ0KDQyLCB2YWxpZGF0ZV92a190cmlwKHJhdykpCiAgICBib3QuX3NhdmVfbWluaWFwcF9kcmFmdCg0MiwgdmFsaWRhdGVfdmtfdHJpcChkaWN0KHJhdywgZGVzdGluYXRpb249ItCi0YPRgNGG0LjRjyIpKSkKICAgIGFzc2VydCBib3QuZ2V0X3Nlc3Npb24oNDIpWyJkZXN0aW5hdGlvbiJdID09ICLQotGD0YDRhtC40Y8iCg==
          OT2: 
          NT2: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          def swap(path, old_key, new_key):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = base64.b64decode(os.environ[old_key]).decode()
              new = base64.b64decode(os.environ[new_key]).decode()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {old_key} block, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          swap('vk_bot.py', 'OF', 'NF')
          swap('shared/vk_miniapp.py', 'OS', 'NS')
          swap('tests/test_vk_bot.py', 'OT1', 'NT1')
          swap('tests/test_vk_bot.py', 'OT2', 'NT2')
          PY
          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run focused tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/test_vk_bot.py tests/test_vk_miniapp.py tests/test_vk_miniapp_attribution.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py shared/vk_miniapp.py tests/test_vk_bot.py
          git commit -m "Let VK Mini App replace unfinished drafts"
          git push origin HEAD:fix/vk-miniapp-replace-draft
