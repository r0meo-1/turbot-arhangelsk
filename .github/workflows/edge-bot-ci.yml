name: Edge Bot CI

on:
  push:
    branches: [ "main", "r0meo-1-edge-automation-bot" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node for Telegram Serverless demo contracts
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Alean Serverless demo contracts and static build
        run: |
          npm --prefix serverless-alean-demo test
          npm --prefix serverless-alean-demo run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/edge_bot_requirements.txt', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r edge_bot_requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install msedge
          python -m playwright install chromium

      - name: Smoke import test
        run: |
          python - <<'PY'
          import importlib, sys
          mods = ['telegram','playwright','dotenv','edge_bot_playwright','edge_bot_bot']
          errors = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  errors.append(f"{m}: {e}")
          if errors:
              print('\n'.join(errors))
              sys.exit(2)
          print('smoke: ok')
          PY

      - name: VK Mini App browser roundtrip
        run: |
          python -m pytest -q tests/test_vk_miniapp_e2e.py

      - name: Agent Desk isolated extension browser contract
        run: python -m pytest -q tests/test_agent_extension_e2e.py

      - name: Telegram Mini App browser roundtrip
        run: |
          python -m pytest -q tests/test_telegram_miniapp_e2e.py

      - name: Alean read-only demo browser flow
        env:
          ALEAN_SCREENSHOTS_DIR: reports/alean-ui
        run: python -m pytest -q tests/test_alean_demo_browser.py

      - name: Preserve Alean demo screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alean-demo-screenshots
          path: reports/alean-ui/
          if-no-files-found: ignore

      - name: Manager mobile browser contracts
        run: |
          python -m pytest -q tests/test_manager_web_e2e.py tests/test_manager_assignment_e2e.py
