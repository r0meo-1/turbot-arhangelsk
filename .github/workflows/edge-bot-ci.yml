name: Edge Bot CI

on:
  push:
    branches: [ "main", "r0meo-1-edge-automation-bot" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/edge_bot_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r edge_bot_requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install msedge

      - name: Smoke import test
        run: |
          python - <<'PY'
import importlib, sys
mods = ['telegram','playwright','dotenv','edge_bot_playwright','edge_bot_bot']
errors = []
for m in mods:
    try:
        importlib.import_module(m)
    except Exception as e:
        errors.append(f"{m}: {e}")
if errors:
    print('\n'.join(errors))
    sys.exit(2)
print('smoke: ok')
PY
