name: workflow-engine-ops-check

on:
  pull_request:
    paths:
      - "tools/workflow-engine/**"
      - "deploy/turbot-deploy.sh"
      - "deploy/send-workflow-engine-bundle.sh"
      - ".github/workflows/workflow-engine-deploy.yml"
      - ".github/workflows/workflow-engine-ops-check.yml"
  push:
    branches:
      - workflow-engine-ops
      - workflow-engine-linear-live
    paths:
      - "tools/workflow-engine/**"
      - "deploy/turbot-deploy.sh"
      - "deploy/send-workflow-engine-bundle.sh"
      - ".github/workflows/workflow-engine-deploy.yml"
      - ".github/workflows/workflow-engine-ops-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n tools/workflow-engine/configure_linear.sh
          bash -n tools/workflow-engine/verify.sh
          bash -n tools/workflow-engine/probe_linear.sh
          bash -n tools/workflow-engine/deploy_delivery_worker.sh
          bash -n tools/workflow-engine/record_linear_mapping.sh
          bash -n deploy/send-workflow-engine-bundle.sh
          bash -n deploy/turbot-deploy.sh

      - name: Check Workflow Engine deploy protocol
        run: |
          grep -q 'WORKFLOW_ENGINE_DEPLOY_BUNDLE_V1' deploy/turbot-deploy.sh
          grep -q 'WORKFLOW_ENGINE_DEPLOY_BUNDLE_V1' deploy/send-workflow-engine-bundle.sh
          grep -q 'workflow_engine.main selftest' deploy/turbot-deploy.sh
          grep -q 'workflow_engine.main status' deploy/turbot-deploy.sh

      - name: Check Python syntax
        run: |
          python -m py_compile tools/workflow-engine/runtime/workflow_engine/delivery_worker.py
