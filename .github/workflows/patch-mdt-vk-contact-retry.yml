name: Patch MDT VK contact retry

on:
  push:
    branches: [fix/mdt-vk-contact-retry]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/mdt-vk-contact-retry
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch and test
        run: |
          set -Eeuo pipefail
          python scripts/patch_mdt_vk_contact_retry.py
          pytest -q tests/test_shared.py -k 'create_lead' tests/test_vk_bot.py -k 'confirmed_mdt_lead_35_stops_retry_once or create_lead'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/mdt.py vk_bot.py tests/test_shared.py tests/test_vk_bot.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore VK contact compatibility and stop stale retry"
          git push origin HEAD:fix/mdt-vk-contact-retry
