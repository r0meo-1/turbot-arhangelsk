name: One-shot VK manager delivery patch

on:
  push:
    branches: [fix/vk-manager-delivery]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vk-manager-delivery

      - name: Patch manager notification and MDT regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          vk = Path("vk_bot.py")
          text = vk.read_text(encoding="utf-8")
          old = '                json={"chat_id": recipient, "text": text, "parse_mode": "HTML"},\n'
          new = (
              '                json={\n'
              '                    "chat_id": recipient,\n'
              '                    "text": text,\n'
              '                    "parse_mode": "HTML",\n'
              '                    "disable_web_page_preview": True,\n'
              '                },\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"telegram payload marker count={text.count(old)}")
          vk.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_shared.py")
          body = tests.read_text(encoding="utf-8")
          old_import = '    dispatch_lead,\n    create_preorder,\n'
          new_import = '    dispatch_lead,\n    create_preorder,\n    create_lead,\n'
          if body.count(old_import) != 1:
              raise SystemExit(f"MDT import marker count={body.count(old_import)}")
          body = body.replace(old_import, new_import, 1)

          test = (
              '\n\ndef test_create_lead_includes_selected_tour():\n'
              '    captured = {}\n\n'
              '    def req(method, params):\n'
              '        captured["method"] = method\n'
              '        captured["params"] = params\n'
              '        return {"id": 321}\n\n'
              '    settings = MDTSettings(enabled=True, mode="lead", source="VK")\n'
              '    ok = create_lead(\n'
              '        settings,\n'
              '        424242,\n'
              '        {\n'
              '            "destination": "Таиланд",\n'
              '            "dates": "2026-10-15",\n'
              '            "nights": "10",\n'
              '            "people": "2",\n'
              '            "budget": 270000,\n'
              '            "budget_scope": "total",\n'
              '            "selected_tour": {\n'
              '                "hotel": "Mandarava Resort & Spa Karon Beach 5★",\n'
              '                "date": "2026-10-29",\n'
              '                "nights": 10,\n'
              '                "meal": "Завтраки",\n'
              '                "price": 155000,\n'
              '                "tour_id": "th-6",\n'
              '            },\n'
              '        },\n'
              '        "+70000000000",\n'
              '        "Тест VK",\n'
              '        request_fn=req,\n'
              '    )\n\n'
              '    assert ok is True\n'
              '    assert captured["method"] == "add-lead"\n'
              '    fields = {field["name"]: field["values"][0] for field in captured["params"]["fields"]}\n'
              '    assert "Mandarava Resort & Spa Karon Beach 5★" in fields["Выбранный тур"]\n'
              '    assert "155000 ₽" in fields["Выбранный тур"]\n'
              '    assert "ID th-6" in fields["Выбранный тур"]\n'
          )
          if "def test_create_lead_includes_selected_tour" not in body:
              body += test
          tests.write_text(body, encoding="utf-8")
          PY

          git diff --check

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused tests
        run: python -m pytest -q tests/test_shared.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk_bot.py tests/test_shared.py
          git commit -m "Polish VK manager lead delivery"
          git push
