name: VK Automated Acceptance
on:
  pull_request:
    paths:
      - 'vk_bot.py'
      - 'vk-miniapp/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/alean_live_smoke.py'
      - 'requirements*.txt'
      - '.github/workflows/vk-automated-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'vk_bot.py'
      - 'vk-miniapp/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/alean_live_smoke.py'
      - 'requirements*.txt'
      - '.github/workflows/vk-automated-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vk-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VK_E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-dev.txt playwright==1.62.0
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Offline dialog, Mini App and supplier contracts
        run: |
          mkdir -p work/vk-acceptance
          python -m pytest -q \
            tests/test_vk_bot.py tests/test_vk_miniapp_e2e.py \
            tests/test_alean.py tests/test_tour_providers.py tests/test_alean_live_smoke.py \
            --basetemp=work/vk-acceptance/screenshots \
            --junitxml=work/vk-acceptance/results.xml
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vk-automated-acceptance-${{ github.run_id }}
          path: work/vk-acceptance/
          retention-days: 14
          if-no-files-found: warn
