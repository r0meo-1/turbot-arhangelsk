name: Deploy TurBot Bundle

on:
  workflow_run:
    workflows: ["Deploy TurBot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Resolve target revision
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      # Also gates workflow_dispatch, which has no preceding workflow_run.
      - uses: ./.github/actions/regression

      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy verified bundle
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash deploy/send-tested-bundle.sh "$EXPECTED_SHA"

      - name: Apply guarded Telegram AI lead assist state
        shell: bash
        env:
          AI_LEAD_ASSIST_ENABLED: ${{ vars.AI_LEAD_ASSIST_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          desired="$(printf '%s' "$AI_LEAD_ASSIST_ENABLED" | tr '[:upper:]' '[:lower:]')"
          if [[ "$desired" != "true" && "$desired" != "false" ]]; then
            echo "AI_LEAD_ASSIST_ENABLED must be true or false" >&2
            exit 1
          fi

          printf 'TURBOT_AI_LEAD_ASSIST_CONFIG_V1\n%s\n' "$desired" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

          health="$(curl -fsSL --max-time 15 https://bot.r0meo1.ru/health)"
          DESIRED="$desired" HEALTH_JSON="$health" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["HEALTH_JSON"])
          ai = data.get("ai_selection") or {}
          desired = os.environ["DESIRED"] == "true"
          if ai.get("lead_assist_enabled") != desired:
              raise SystemExit(
                  "Production AI lead assist state mismatch: "
                  f"expected={desired} actual={ai.get('lead_assist_enabled')}"
              )
          print(
              "Production AI lead assist: "
              f"enabled={'yes' if desired else 'no'} "
              f"provider_ready={'yes' if ai.get('ready') is True else 'no'} "
              f"mode={ai.get('mode') or 'unknown'} "
              f"model={ai.get('model') or 'unknown'}"
          )
          PY

      - name: Verify public running revision
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          python3 deploy/verify_revision.py --expected "$EXPECTED_SHA"
          python3 deploy/verify_revision.py --expected "$EXPECTED_SHA" --url https://bot.r0meo1.ru/vk/health

      - name: Verify production backup and isolated restore drill
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'TURBOT_BACKUP_DRILL_V1\n' |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

      - name: Verify deployed legal content and base headers
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://bot.r0meo1.ru"
          legal_json="$(mktemp)"
          vk_privacy_body="$(mktemp)"
          vk_privacy_headers="$(mktemp)"
          telegram_privacy_body="$(mktemp)"
          telegram_privacy_headers="$(mktemp)"
          cleanup() {
            rm -f "$legal_json" "$vk_privacy_body" "$vk_privacy_headers" \
              "$telegram_privacy_body" "$telegram_privacy_headers"
          }
          trap cleanup EXIT

          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$base/vk/miniapp/legal.json" -o "$legal_json" &&
               curl -fsSL --max-time 15 -D "$vk_privacy_headers" "$base/privacy" -o "$vk_privacy_body" &&
               curl -fsSL --max-time 15 -D "$telegram_privacy_headers" "$base/tg/privacy" -o "$telegram_privacy_body"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Production legal routes did not become ready" >&2
              exit 1
            fi
            sleep 5
          done

          python - "$legal_json" "$vk_privacy_body" "$telegram_privacy_body" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          operator = str(data.get("operatorName") or "").strip()
          if not operator:
              raise SystemExit("VK legal operator is blank")
          if operator == 'ТА «АПРЕЛЬ тур»':
              raise SystemExit("VK legal operator is still the generic brand fallback")
          if "[указать" in operator or "ЧЕРНОВИК" in operator:
              raise SystemExit("VK legal operator contains a placeholder")

          with open(sys.argv[2], encoding="utf-8") as fh:
              vk_privacy = fh.read()
          if "ИП Замятина Мария Андреевна" not in vk_privacy:
              raise SystemExit("VK privacy page has no verified operator")
          for forbidden in (
              "Telegram",
              "t.me/",
              "r0meo1.ru/apreltour",
              "ЧЕРНОВИК / ШАБЛОН",
              "[указать",
          ):
              if forbidden in vk_privacy:
                  raise SystemExit(
                      f"VK privacy page contains forbidden moderation text: {forbidden}"
                  )

          with open(sys.argv[3], encoding="utf-8") as fh:
              telegram_privacy = fh.read()
          if "ИП Замятина Мария Андреевна" not in telegram_privacy:
              raise SystemExit("Telegram privacy page has no verified operator")
          if "Telegram-бота TurBot" not in telegram_privacy:
              raise SystemExit("Telegram privacy page is not channel-specific")
          for forbidden in ("ЧЕРНОВИК / ШАБЛОН", "[указать"):
              if forbidden in telegram_privacy:
                  raise SystemExit("Telegram privacy page still contains draft placeholders")
          PY

          for header_file in "$vk_privacy_headers" "$telegram_privacy_headers"; do
            grep -qi '^x-content-type-options: nosniff' "$header_file" ||
              { echo "Privacy response is missing nosniff" >&2; exit 1; }
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$header_file" ||
              { echo "Privacy response is missing Referrer-Policy" >&2; exit 1; }
            grep -qi '^permissions-policy:.*camera=()' "$header_file" ||
              { echo "Privacy response is missing Permissions-Policy" >&2; exit 1; }
          done

          echo "Production channel-specific legal content and base app security headers: ok"

          check_security_headers() {
            local label="$1"
            local header_file="$2"
            grep -qi '^x-content-type-options: nosniff' "$header_file" ||
              { echo "$label missing nosniff" >&2; return 1; }
            grep -qi '^referrer-policy:' "$header_file" ||
              { echo "$label missing Referrer-Policy" >&2; return 1; }
            grep -qi '^permissions-policy:.*camera=()' "$header_file" ||
              { echo "$label missing Permissions-Policy" >&2; return 1; }
            grep -qi '^strict-transport-security: max-age=31536000' "$header_file" ||
              { echo "$label missing host-scoped HSTS" >&2; return 1; }
            grep -qi '^content-security-policy-report-only:.*default-src' "$header_file" ||
              { echo "$label missing CSP Report-Only" >&2; return 1; }
          }

          health_headers="$(mktemp)"
          vk_headers="$(mktemp)"
          tg_headers="$(mktemp)"
          trap 'cleanup; rm -f "$health_headers" "$vk_headers" "$tg_headers"' EXIT

          curl -fsSL --max-time 15 -D "$health_headers" "$base/health" -o /dev/null
          curl -fsSL --max-time 15 -D "$vk_headers" "$base/vk/miniapp/legal.json" -o /dev/null
          tg_status="$(curl -sS --max-time 15 -D "$tg_headers" -o /dev/null -w '%{http_code}' \
            -X POST "$base/miniapp/submit" \
            -H 'Origin: https://r0meo-1.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"initData":"tampered","payload":{}}')"
          if [[ "$tg_status" != "401" ]]; then
            echo "Telegram Mini App invalid-auth header probe returned HTTP $tg_status, expected 401" >&2
            exit 1
          fi

          check_security_headers "health" "$health_headers"
          check_security_headers "VK privacy" "$vk_privacy_headers"
          check_security_headers "Telegram privacy" "$telegram_privacy_headers"
          check_security_headers "VK Mini App" "$vk_headers"
          check_security_headers "Telegram Mini App API" "$tg_headers"
          echo "Runtime security headers smoke: ok"

      - name: Verify Agent Desk production routes
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://bot.r0meo1.ru"

          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$base/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "TurBot public health check failed" >&2
              exit 1
            fi
            sleep 5
          done

          for path in \
            agent-extension/leads \
            agent-extension/export.csv \
            agent-extension/crm/today \
            'agent-extension/crm/timeline?requestId=vk-lead-synthetic'; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base/$path")"
            if [[ "$status" != "401" ]]; then
              echo "$path returned HTTP $status without auth; expected 401" >&2
              exit 1
            fi
          done

          for path in \
            agent-extension/status \
            agent-extension/crm/task \
            agent-extension/crm/quote \
            agent-extension/crm/reaction \
            agent-extension/crm/activity \
            agent-extension/crm/outcome; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              -X POST "$base/$path" \
              -H 'Content-Type: application/json' \
              --data '{}')"
            if [[ "$status" != "401" ]]; then
              echo "$path returned HTTP $status without auth; expected 401" >&2
              exit 1
            fi
          done

          echo "Agent Desk 0.3.0 production routes are deployed and fail closed without auth"
