name: Deploy TurBot Bundle

on:
  workflow_run:
    workflows: ["Deploy TurBot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbot-bundle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve target revision
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Build tracked-file bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          git ls-files > .deploy-manifest
          test -s .deploy-manifest
          tar -czf /tmp/turbot-bundle.tar.gz -T .deploy-manifest .deploy-manifest
          test -s /tmp/turbot-bundle.tar.gz

      - name: Load restricted deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy verified bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            printf 'TURBOT_DEPLOY_BUNDLE_V1\n%s\n' '${{ steps.target.outputs.sha }}'
            cat /tmp/turbot-bundle.tar.gz
          } |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@${{ secrets.DEPLOY_HOST }} true

      - name: Verify deployed legal content and base headers
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://bot.r0meo1.ru"
          legal_json="$(mktemp)"
          privacy_body="$(mktemp)"
          privacy_headers="$(mktemp)"
          cleanup() {
            rm -f "$legal_json" "$privacy_body" "$privacy_headers"
          }
          trap cleanup EXIT

          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$base/vk/miniapp/legal.json" -o "$legal_json" &&
               curl -fsSL --max-time 15 -D "$privacy_headers" "$base/privacy" -o "$privacy_body"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Production legal routes did not become ready" >&2
              exit 1
            fi
            sleep 5
          done

          python - "$legal_json" "$privacy_body" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          operator = str(data.get("operatorName") or "").strip()
          if not operator:
              raise SystemExit("VK legal operator is blank")
          if operator == 'ТА «АПРЕЛЬ тур»':
              raise SystemExit("VK legal operator is still the generic brand fallback")
          if "[указать" in operator or "ЧЕРНОВИК" in operator:
              raise SystemExit("VK legal operator contains a placeholder")

          with open(sys.argv[2], encoding="utf-8") as fh:
              privacy = fh.read()
          if "ИП Замятина Мария Андреевна" not in privacy:
              raise SystemExit("Telegram privacy page has no verified operator")
          for forbidden in ("ЧЕРНОВИК / ШАБЛОН", "[указать"):
              if forbidden in privacy:
                  raise SystemExit("Telegram privacy page still contains draft placeholders")
          PY

          grep -qi '^x-content-type-options: nosniff' "$privacy_headers" ||
            { echo "Privacy response is missing nosniff" >&2; exit 1; }
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$privacy_headers" ||
            { echo "Privacy response is missing Referrer-Policy" >&2; exit 1; }
          grep -qi '^permissions-policy:.*camera=()' "$privacy_headers" ||
            { echo "Privacy response is missing Permissions-Policy" >&2; exit 1; }

          echo "Production legal content and base app security headers: ok"

      - name: Verify Agent Desk production routes
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://bot.r0meo1.ru"

          for attempt in {1..12}; do
            if curl -fsSL --max-time 15 "$base/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "TurBot public health check failed" >&2
              exit 1
            fi
            sleep 5
          done

          for path in agent-extension/leads agent-extension/export.csv; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base/$path")"
            if [[ "$status" != "401" ]]; then
              echo "$path returned HTTP $status without auth; expected 401" >&2
              exit 1
            fi
          done

          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST "$base/agent-extension/status" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          if [[ "$status" != "401" ]]; then
            echo "agent-extension/status returned HTTP $status without auth; expected 401" >&2
            exit 1
          fi

          echo "Agent Desk production routes are deployed and fail closed without auth"
