name: Tripadvisor Live Smoke

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Destination query for the live Terra smoke
        required: true
        default: Phuket
      limit:
        description: Maximum hotel facts to validate (1-20)
        required: true
        default: "10"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
      TRIPADVISOR_BASE_URL: https://terra.tripadvisor.com/api
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require Tripadvisor credential
        shell: bash
        run: |
          if [ -z "$TRIPADVISOR_API_KEY" ]; then
            echo "M2B BLOCKED: repository secret TRIPADVISOR_API_KEY is not configured."
            exit 2
          fi

      - name: Run strict Phuket live smoke
        run: >-
          python scripts/tripadvisor_live_smoke.py
          --destination "${{ inputs.destination }}"
          --limit "${{ inputs.limit }}"
          --locale en-US
