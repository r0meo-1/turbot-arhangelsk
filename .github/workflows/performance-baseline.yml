name: Production Performance Baseline

on:
  push:
    branches: [main]
    paths:
      - "deploy/performance_probe.py"
      - ".github/workflows/performance-baseline.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbot-performance-baseline
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.62.0"
          python -m playwright install msedge

      - name: Measure production under mobile and desktop profiles
        run: |
          python deploy/performance_probe.py \
            --profile mobile-slow4g \
            --json-out /tmp/performance-mobile.json
          python deploy/performance_probe.py \
            --profile desktop-broadband \
            --json-out /tmp/performance-desktop.json
          {
            echo "### TurBot production performance baseline"
            echo
            echo "Mobile: 390x844, 150ms latency, 1.6Mbps down, 750Kbps up"
            echo "Desktop: 1280x800, 50ms latency, 10Mbps down, 2Mbps up"
            echo
            echo "#### Mobile / Slow-4G"
            echo '~~~json'
            cat /tmp/performance-mobile.json
            echo '~~~'
            echo
            echo "#### Desktop / bounded broadband"
            echo '~~~json'
            cat /tmp/performance-desktop.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe aggregate baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: |
            /tmp/performance-mobile.json
            /tmp/performance-desktop.json
          retention-days: 14
