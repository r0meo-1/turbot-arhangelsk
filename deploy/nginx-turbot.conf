# nginx site config for TurBot webhook.
#
# 1. Copy to /etc/nginx/sites-available/turbot.conf
# 2. Replace BOT_DOMAIN with your domain (e.g. bot.apreltur.ru)
# 3. ln -s /etc/nginx/sites-available/turbot.conf /etc/nginx/sites-enabled/
# 4. mkdir -p /var/www/certbot
# 5. Get the certificate FIRST (see DEPLOY.md), then reload nginx.

# --- HTTP: redirect to HTTPS + serve ACME challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name BOT_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy to gunicorn ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name BOT_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/BOT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/BOT_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Telegram sends updates to /webhook; proxy to gunicorn.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
