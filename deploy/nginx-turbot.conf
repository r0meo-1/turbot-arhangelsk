# nginx site config for TurBot.
#
# install.sh fills the placeholders; you normally do not edit this by hand.
#   BOT_DOMAIN     — domain name, or `_` when serving a bare IP
#   SSL_CERT_PATH  — fullchain.pem (Let's Encrypt) or the self-signed cert
#   SSL_KEY_PATH   — matching private key
#
# Manual use:
#   1. Copy to /etc/nginx/sites-available/turbot.conf
#   2. Replace the three placeholders above
#   3. ln -s /etc/nginx/sites-available/turbot.conf /etc/nginx/sites-enabled/
#   4. Obtain the certificate FIRST (see DEPLOY.md), then reload nginx.

# --- HTTP: ACME challenge, everything else redirected ---
server {
    listen 80;
    listen [::]:80;
    server_name BOT_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy to gunicorn ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name BOT_DOMAIN;

    ssl_certificate     SSL_CERT_PATH;
    ssl_certificate_key SSL_KEY_PATH;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Telegram's webhook payloads are far below this; the cap only stops a
    # bogus request from buffering to disk.
    client_max_body_size 2m;

    # VK bot is a separate service on 5100 serving /vk/webhook. Without this
    # block it has no public HTTPS address at all — and VK's Callback API
    # requires HTTPS, so the VK bot simply never works.
    location /vk/ {
        proxy_pass         http://127.0.0.1:5100;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Telegram bot: /webhook, /health, /privacy, /
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
