# Docker Compose serves plain HTTP inside the host. Terminate TLS in the
# external reverse proxy (Caddy, nginx or a load balancer) that fronts :80.
log_format turbot_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log turbot_safe;
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location /vk/ {
        proxy_pass http://vk-bot:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://telegram-bot:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
